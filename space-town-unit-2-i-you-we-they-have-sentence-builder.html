<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QK9TJVW1KW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QK9TJVW1KW');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Builder - I, You, We, They Have</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Basic animations and custom styling for a playful feel */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #eff6ff; /* Light blue background for variation */
        }
        .word-btn {
            transition: all 0.2s ease;
        }
        .word-btn:active {
            transform: scale(0.95);
        }
        /* Shake animation for incorrect answer */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        .image-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            flex-shrink: 0;
        }
        /* Slightly smaller for dual images */
        .image-container.small {
            width: 120px;
            height: 120px;
        }
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white w-full max-w-5xl rounded-2xl shadow-xl p-6 md:p-8">
        
        <!-- Header / Scoreboard -->
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600">Sentence Builder: I / You / We / They</h1>
            <div class="text-lg font-semibold text-gray-700">
                Score: <span id="scoreDisplay" class="text-blue-500">0</span>
            </div>
        </div>

        <!-- Visual Prompts Area -->
        <div class="flex flex-col md:flex-row items-center justify-center gap-6 mb-10">
            <!-- Subject Images (Dynamically filled for 1 or 2 students) -->
            <div class="flex flex-col items-center w-full md:w-auto overflow-x-auto py-2">
                <div id="subjectImagesContainer" class="flex gap-2 justify-center items-center h-[180px]">
                    <!-- Images injected here by JS -->
                </div>
            </div>

            <!-- Plus & Amount -->
            <div class="text-4xl font-bold text-gray-400 flex items-center gap-4">
                <span>+</span>
                <div class="bg-yellow-100 text-yellow-600 rounded-full w-16 h-16 flex items-center justify-center border-4 border-yellow-300">
                    <span id="amountDisplay"></span>
                </div>
                <span>+</span>
            </div>

            <!-- Stationery Item Image -->
            <div class="flex flex-col items-center h-[150px] justify-center">
                <div class="image-container">
                    <img id="itemImage" src="" alt="Stationery" onerror="this.src='https://placehold.co/150x150/e2e8f0/475569?text=Item'">
                </div>
            </div>
        </div>

        <!-- Constructed Sentence Area -->
        <div class="mb-8">
            <h2 class="text-gray-600 font-semibold mb-2">Your Sentence: (Click a word to remove it)</h2>
            <div id="sentenceArea" class="flex flex-wrap gap-2 p-4 bg-gray-50 rounded-xl min-h-[80px] items-center border border-gray-200">
                <!-- Clicked words will appear here -->
            </div>
        </div>

        <!-- Word Bank Area -->
        <div class="mb-8">
            <h2 class="text-gray-600 font-semibold mb-2">Word Bank:</h2>
            <div id="wordBankArea" class="flex flex-wrap gap-3 p-4 bg-blue-50 rounded-xl border border-blue-100 min-h-[100px]">
                <!-- Draggable/Clickable words will appear here -->
            </div>
        </div>

        <!-- Controls & Feedback -->
        <div class="flex flex-col items-center gap-4">
            <div id="feedbackMessage" class="text-xl font-bold h-8 text-center hidden transition-opacity duration-300"></div>
            
            <div class="flex gap-4">
                <button type="button" id="checkBtn" onclick="checkAnswer()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 text-lg">
                    Check Answer
                </button>
                <button type="button" id="nextBtn" onclick="initGame()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 text-lg hidden">
                    Next Question
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- Data Definitions ---
        const studentImages = [
            'images/students/boy1.jpg',
            'images/students/boy2.jpg',
            'images/students/boy3.jpg',
            'images/students/girl1.jpg',
            'images/students/girl2.jpg',
            'images/students/girl3.jpg'
        ];

        const targetPronouns = [
            { word: 'I' },
            { word: 'You' },
            { word: 'We' },
            { word: 'They' }
        ];

        const stationeryItems = [
            { file: 'images/stationery/book.jpg', name: 'book', plural: 'books' },
            { file: 'images/stationery/coloured-pencil.jpg', name: 'coloured pencil', plural: 'coloured pencils' },
            { file: 'images/stationery/eraser.jpg', name: 'eraser', plural: 'erasers' },
            { file: 'images/stationery/glue-stick.jpg', name: 'glue stick', plural: 'glue sticks' },
            { file: 'images/stationery/pen.jpg', name: 'pen', plural: 'pens' },
            { file: 'images/stationery/pencil-case.jpg', name: 'pencil case', plural: 'pencil cases' },
            { file: 'images/stationery/pencil.jpg', name: 'pencil', plural: 'pencils' },
            { file: 'images/stationery/ruler.jpg', name: 'ruler', plural: 'rulers' },
            { file: 'images/stationery/school-bag.jpg', name: 'school bag', plural: 'school bags' },
            { file: 'images/stationery/sharpener.jpg', name: 'sharpener', plural: 'sharpeners' }
        ];

        const numberWords = {
            1: 'one', 2: 'two', 3: 'three', 4: 'four', 5: 'five',
            6: 'six', 7: 'seven', 8: 'eight', 9: 'nine', 10: 'ten'
        };

        const allPossiblePronouns = ['I', 'You', 'We', 'They', 'He', 'She'];

        // --- Game State ---
        let currentTargetPronoun = null;
        let currentAmount = 0;
        let currentItem = null;
        let builtSentence = [];
        let score = 0;
        let wordBankData = [];

        // --- Utility Functions ---
        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const getRandomElement = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const shuffleArray = (array) => {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        // --- Game Logic ---
        function initGame() {
            builtSentence = [];
            hideFeedback();
            document.getElementById('checkBtn').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');

            // 1. Pick Pronoun configuration (I, You, We, They)
            currentTargetPronoun = getRandomElement(targetPronouns);
            setupSubjectImages(currentTargetPronoun.word);

            // 2. Pick Amount
            currentAmount = getRandomInt(1, 10);
            document.getElementById('amountDisplay').textContent = currentAmount;

            // 3. Pick Item
            currentItem = getRandomElement(stationeryItems);
            document.getElementById('itemImage').src = currentItem.file;

            // 4. Generate Word Bank
            generateWordBank();

            // 5. Render
            renderUI();
        }

        function setupSubjectImages(pronounStr) {
            const container = document.getElementById('subjectImagesContainer');
            container.innerHTML = '';
            
            let availableImages = shuffleArray([...studentImages]);
            const speakerImg = availableImages.pop();
            
            const createImgDiv = (src, labelText, isSpeaker = false, size = '100px') => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col items-center justify-center';
                
                const imgDiv = document.createElement('div');
                imgDiv.className = 'image-container border-4 ' + (isSpeaker ? 'border-blue-400 shadow-md bg-blue-50' : 'border-gray-200 bg-white');
                imgDiv.style.width = size;
                imgDiv.style.height = size;
                
                const img = document.createElement('img');
                img.src = src;
                img.alt = 'Subject';
                img.onerror = function() {
                    this.onerror = null;
                    this.src = 'https://placehold.co/150x150/e2e8f0/475569?text=Student';
                };
                
                imgDiv.appendChild(img);
                wrapper.appendChild(imgDiv);
                
                if (labelText) {
                    const label = document.createElement('span');
                    label.className = 'text-xs font-bold mt-1.5 text-gray-700 bg-white px-2 py-0.5 rounded shadow-sm border border-gray-200 whitespace-nowrap z-10';
                    label.textContent = labelText;
                    wrapper.appendChild(label);
                }
                return wrapper;
            };

            const createArrow = () => {
                const arrow = document.createElement('div');
                arrow.className = 'text-3xl md:text-4xl mx-1 text-blue-500 font-bold';
                arrow.textContent = '➡️';
                return arrow;
            };

            if (pronounStr === 'I') {
                container.appendChild(createImgDiv(speakerImg, 'Speaker: Me 🙋', true, '130px'));
            } else if (pronounStr === 'You') {
                container.appendChild(createImgDiv(speakerImg, 'Speaker', true, '100px'));
                container.appendChild(createArrow());
                container.appendChild(createImgDiv(availableImages.pop(), 'Subject (You)', false, '100px'));
            } else if (pronounStr === 'They') {
                container.appendChild(createImgDiv(speakerImg, 'Speaker', true, '90px'));
                container.appendChild(createArrow());
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'flex gap-1 border-2 border-dashed border-gray-400 p-1.5 rounded-xl bg-gray-50';
                groupDiv.appendChild(createImgDiv(availableImages.pop(), '', false, '80px'));
                groupDiv.appendChild(createImgDiv(availableImages.pop(), '', false, '80px'));
                
                const wrap = document.createElement('div');
                wrap.className = 'flex flex-col items-center';
                wrap.appendChild(groupDiv);
                const label = document.createElement('span');
                label.className = 'text-xs font-bold mt-1.5 text-gray-700 bg-white px-2 py-0.5 rounded shadow-sm border border-gray-200 whitespace-nowrap z-10';
                label.textContent = 'Subjects (They)';
                wrap.appendChild(label);
                
                container.appendChild(wrap);
            } else if (pronounStr === 'We') {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'flex gap-2 border-4 border-green-400 p-2.5 rounded-2xl bg-green-50 relative mt-3 shadow-lg';
                groupDiv.appendChild(createImgDiv(speakerImg, 'Speaker', true, '95px'));
                groupDiv.appendChild(createImgDiv(availableImages.pop(), 'Friend', false, '95px'));
                
                const label = document.createElement('div');
                label.className = 'absolute -top-4 left-1/2 transform -translate-x-1/2 text-xs font-bold text-green-800 bg-white px-3 py-0.5 rounded-full shadow-md border-2 border-green-400 whitespace-nowrap z-10';
                label.textContent = 'Speaker is in the group (We)';
                groupDiv.appendChild(label);
                
                container.appendChild(groupDiv);
            }
        }

        function generateWordBank() {
            wordBankData = [];
            
            // 1. Pronouns: Correct one + 2 random distractors
            wordBankData.push({ id: 'w_pro_correct', text: currentTargetPronoun.word, type: 'pronoun' });
            
            let remainingPronouns = allPossiblePronouns.filter(p => p !== currentTargetPronoun.word);
            let distractors = shuffleArray(remainingPronouns).slice(0, 2);
            wordBankData.push({ id: 'w_pro_d1', text: distractors[0], type: 'pronoun' });
            wordBankData.push({ id: 'w_pro_d2', text: distractors[1], type: 'pronoun' });

            // 2. Verbs: Correct (have) + distractor (has)
            wordBankData.push({ id: 'w_verb_correct', text: 'have', type: 'verb' });
            wordBankData.push({ id: 'w_verb_dist', text: 'has', type: 'verb' });

            // 3. Numbers: Correct + 2 distractors
            let usedNumbers = new Set([currentAmount]);
            wordBankData.push({ id: 'w_num_correct', text: numberWords[currentAmount], type: 'number' });
            
            while(usedNumbers.size < 3) {
                let rNum = getRandomInt(1, 10);
                if (!usedNumbers.has(rNum)) {
                    usedNumbers.add(rNum);
                    wordBankData.push({ id: `w_num_${rNum}`, text: numberWords[rNum], type: 'number' });
                }
            }

            // 4. Items: Correct and distractor
            let correctItemStr = currentAmount > 1 ? currentItem.plural : currentItem.name;
            wordBankData.push({ id: 'w_item_correct_punc', text: correctItemStr + '.', type: 'item' });
            wordBankData.push({ id: 'w_item_correct_nopunc', text: correctItemStr, type: 'item' });

            let distractorItem = null;
            do {
                distractorItem = getRandomElement(stationeryItems);
            } while (distractorItem.name === currentItem.name);

            // Keep plurality consistent with the current amount to avoid grammar giveaways
            let distractorItemStr = currentAmount > 1 ? distractorItem.plural : distractorItem.name;
            wordBankData.push({ id: 'w_item_dist_punc', text: distractorItemStr + '.', type: 'item' });
            wordBankData.push({ id: 'w_item_dist_nopunc', text: distractorItemStr, type: 'item' });

            // Shuffle everything
            wordBankData = shuffleArray(wordBankData);
        }

        function renderUI() {
            const wordBankContainer = document.getElementById('wordBankArea');
            const sentenceContainer = document.getElementById('sentenceArea');

            // Clear containers
            wordBankContainer.innerHTML = '';
            sentenceContainer.innerHTML = '';

            // Render Sentence
            if (builtSentence.length === 0) {
                sentenceContainer.innerHTML = '<span class="text-gray-400 italic">Construct your sentence here...</span>';
            } else {
                builtSentence.forEach((wordObj, index) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'word-btn bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow cursor-pointer border border-blue-700 hover:bg-blue-700';
                    btn.textContent = wordObj.text;
                    btn.onclick = () => removeWordFromSentence(index);
                    sentenceContainer.appendChild(btn);
                });
            }

            // Render Word Bank (exclude items currently in sentence)
            const usedIds = builtSentence.map(w => w.id);
            wordBankData.forEach(wordObj => {
                if (!usedIds.includes(wordObj.id)) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'word-btn bg-white text-gray-800 font-bold py-2 px-4 rounded-lg shadow hover:bg-blue-50 hover:text-blue-600 border border-gray-200 cursor-pointer';
                    btn.textContent = wordObj.text;
                    btn.onclick = () => addWordToSentence(wordObj);
                    wordBankContainer.appendChild(btn);
                }
            });
        }

        function addWordToSentence(wordObj) {
            builtSentence.push(wordObj);
            renderUI();
        }

        function removeWordFromSentence(index) {
            builtSentence.splice(index, 1);
            renderUI();
        }

        function checkAnswer() {
            if (builtSentence.length === 0) return;

            const expectedPronoun = currentTargetPronoun.word;
            const expectedVerb = 'have';
            const expectedNumber = numberWords[currentAmount];
            const expectedItem = (currentAmount > 1 ? currentItem.plural : currentItem.name) + '.';

            let isCorrect = false;

            if (builtSentence.length === 4) {
                if (
                    builtSentence[0].text === expectedPronoun &&
                    builtSentence[1].text === expectedVerb &&
                    builtSentence[2].text === expectedNumber &&
                    builtSentence[3].text === expectedItem
                ) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                showFeedback("Correct! Great job!", true);
                score += 1;
                document.getElementById('scoreDisplay').textContent = score;
                document.getElementById('checkBtn').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
            } else {
                showFeedback("Not quite right. Try again!", false);
                const sentenceArea = document.getElementById('sentenceArea');
                sentenceArea.classList.remove('shake');
                void sentenceArea.offsetWidth; // trigger reflow
                sentenceArea.classList.add('shake');
                
                // Specific hint generation
                if (builtSentence.length > 0) {
                    let lastWord = builtSentence[builtSentence.length - 1].text;
                    
                    if (builtSentence.length === 4 && !lastWord.endsWith('.')) {
                        setTimeout(() => showFeedback("Don't forget the full stop!", false), 1500);
                    } else if (builtSentence.length > 0 && builtSentence[0].text !== expectedPronoun && allPossiblePronouns.includes(builtSentence[0].text)) {
                         setTimeout(() => showFeedback(`Look at the pictures! The subject should be '${expectedPronoun}'.`, false), 1500);
                    } else if (builtSentence.length > 1 && builtSentence[1].text === 'has') {
                         setTimeout(() => showFeedback(`We use 'have' with I, You, We, and They.`, false), 1500);
                    }
                }
            }
        }

        function showFeedback(message, isSuccess) {
            const fb = document.getElementById('feedbackMessage');
            fb.textContent = message;
            fb.classList.remove('hidden', 'text-green-600', 'text-red-500');
            
            if (isSuccess) {
                fb.classList.add('text-green-600', 'block');
            } else {
                fb.classList.add('text-red-500', 'block');
            }
        }

        function hideFeedback() {
            const fb = document.getElementById('feedbackMessage');
            fb.classList.add('hidden');
            fb.textContent = '';
        }

        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
