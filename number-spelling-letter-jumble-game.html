<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game with Visible Fullscreen Button</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* The root container that enters full-screen mode */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      background-color: #1e1e1e;
      border: 2px solid #333333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Native Fullscreen style override */
    #game-container:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border: none;
      border-radius: 0;
    }

    #game-container:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border: none;
      border-radius: 0;
    }

    /* Visible persistent top bar */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #262626;
      padding: 10px 16px;
      border-bottom: 2px solid #333333;
      z-index: 50;
    }

    .game-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Highlighted Fullscreen Button */
    .fullscreen-trigger-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s, transform 0.1s;
      user-select: none;
    }

    .fullscreen-trigger-btn:hover {
      background-color: #1d4ed8;
    }

    .fullscreen-trigger-btn:active {
      transform: scale(0.96);
    }

    /* Canvas play area */
    .viewport {
      position: relative;
      width: 100%;
      flex: 1;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* On-screen controls placed over the canvas */
    #game-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 24px;
      pointer-events: none; /* Let canvas capture other clicks */
      z-index: 40;
    }

    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .dpad-row {
      display: flex;
      gap: 6px;
    }

    .control-btn {
      pointer-events: auto; /* Buttons accept touch and click */
      background: rgba(255, 255, 255, 0.85);
      color: #111111;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background-color 0.1s;
    }

    .control-btn:active {
      background: #ffffff;
    }

    .dir-btn {
      width: 50px;
      height: 50px;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn {
      min-width: 80px;
      height: 50px;
      font-size: 1rem;
      padding: 0 16px;
    }
  </style>
</head>
<body>

  <!-- Game Wrapper -->
  <div id="game-container">
    
    <!-- Top Bar with Visible Fullscreen Button -->
    <header class="top-header">
      <span class="game-title">Canvas Game</span>
      <button id="fullscreen-btn" class="fullscreen-trigger-btn" type="button">
        ⛶ Fullscreen
      </button>
    </header>

    <!-- Canvas Area -->
    <main class="viewport">
      <canvas id="game-canvas" width="800" height="500"></canvas>

      <!-- Persistent On-Screen Controls -->
      <nav id="game-controls" aria-label="Game Controls">
        <div class="dpad">
          <button id="btn-up" class="control-btn dir-btn" aria-label="Up">▲</button>
          <div class="dpad-row">
            <button id="btn-left" class="control-btn dir-btn" aria-label="Left">◀</button>
            <button id="btn-down" class="control-btn dir-btn" aria-label="Down">▼</button>
            <button id="btn-right" class="control-btn dir-btn" aria-label="Right">▶</button>
          </div>
        </div>

        <button id="btn-action" class="control-btn action-btn">Action</button>
      </nav>
    </main>

  </div>

  <script>
    // --- Fullscreen Toggle Logic ---
    const container = document.getElementById('game-container');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    function toggleFullscreen() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

      if (!isFullscreen) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function syncFullscreenButton() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
      if (isFullscreen) {
        fullscreenBtn.textContent = '✖ Exit Fullscreen';
        fullscreenBtn.style.backgroundColor = '#dc2626'; // Red for exit
      } else {
        fullscreenBtn.textContent = '⛶ Fullscreen';
        fullscreenBtn.style.backgroundColor = '#2563eb'; // Blue for enter
      }
    }

    document.addEventListener('fullscreenchange', syncFullscreenButton);
    document.addEventListener('webkitfullscreenchange', syncFullscreenButton);

    // --- Simple Canvas Game Loop ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const player = { x: 375, y: 225, size: 40, speed: 5 };
    const keys = { up: false, down: false, left: false, right: false };

    function bindTouchControl(id, dir) {
      const el = document.getElementById(id);
      const setPressed = (val) => (e) => { e.preventDefault(); keys[dir] = val; };

      el.addEventListener('mousedown', setPressed(true));
      el.addEventListener('mouseup', setPressed(false));
      el.addEventListener('mouseleave', setPressed(false));
      el.addEventListener('touchstart', setPressed(true), { passive: false });
      el.addEventListener('touchend', setPressed(false), { passive: false });
    }

    bindTouchControl('btn-up', 'up');
    bindTouchControl('btn-down', 'down');
    bindTouchControl('btn-left', 'left');
    bindTouchControl('btn-right', 'right');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    function loop() {
      if (keys.up && player.y > 0) player.y -= player.speed;
      if (keys.down && player.y + player.size < canvas.height) player.y += player.speed;
      if (keys.left && player.x > 0) player.x -= player.speed;
      if (keys.right && player.x + player.size < canvas.width) player.x += player.speed;

      // Background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid Pattern
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Player
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y, player.size, player.size);

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
