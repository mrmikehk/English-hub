<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Spell Jumble! 🌟</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti for winning celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Fredoka', 'Inter', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* 3D bouncy tile styling */
    .tile-3d {
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.2s;
    }
    .tile-3d:active, .tile-3d.active-press {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }

    /* Dragging ghost styling */
    .dragging-ghost {
      opacity: 0.45;
      transform: scale(0.95);
    }
    .touch-dragging {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 16px 24px rgba(0,0,0,0.25);
      transition: none !important;
    }

    /* Slot hover highlight */
    .slot-hover {
      border-color: #6366f1 !important;
      background-color: #e0e7ff !important;
      transform: scale(1.06);
    }

    /* Keyframe animations */
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(8deg); }
      60% { transform: rotate(-5deg); }
      80% { transform: rotate(5deg); }
    }
    .animate-wiggle {
      animation: wiggle 0.45s ease-in-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Sparkle pulse for numeral container */
    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: floaty 3s ease-in-out infinite;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-sky-100 via-amber-50 to-indigo-100 min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-5 overflow-x-hidden">

  <!-- TOP APP BAR / SCOREBOARD -->
  <header class="max-w-2xl mx-auto w-full flex items-center justify-between bg-white/90 backdrop-blur-md rounded-2xl px-4 py-2.5 shadow-md border border-white/60 mb-2">
    <div class="flex items-center gap-2">
      <span class="text-2xl sm:text-3xl">🎯</span>
      <div>
        <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent leading-none">
          Word Scramble
        </h1>
        <p class="text-xs text-slate-500 font-medium">Spell the number!</p>
      </div>
    </div>

    <!-- Stats: Streak & Score -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1 bg-amber-50 border border-amber-200 px-3 py-1 rounded-xl text-amber-800 text-sm font-bold shadow-sm">
        <span>⭐</span>
        <span id="scoreDisplay">Score: 0</span>
      </div>
      <div class="flex items-center gap-1 bg-rose-50 border border-rose-200 px-3 py-1 rounded-xl text-rose-700 text-sm font-bold shadow-sm">
        <span>🔥</span>
        <span id="streakDisplay">0</span>
      </div>
      <!-- Audio Toggle -->
      <button id="soundToggle" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-base transition-colors" title="Toggle Sound">
        🔊
      </button>
    </div>
  </header>

  <!-- MAIN GAME AREA -->
  <main class="max-w-2xl mx-auto w-full flex-1 flex flex-col justify-center items-center gap-4 py-2">
    
    <!-- TOP SECTION: BIG NUMERAL & VISUAL COUNTER -->
    <div class="w-full flex flex-col items-center">
      <div class="animate-float relative flex flex-col items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 rounded-3xl p-4 sm:p-6 shadow-xl border-4 border-white text-white w-48 sm:w-56 text-center">
        <!-- Fun badge -->
        <div class="absolute -top-3 bg-yellow-400 text-yellow-950 text-xs px-3 py-0.5 rounded-full font-bold shadow uppercase tracking-wider">
          Target Number
        </div>
        <!-- Huge Numeral -->
        <span id="numeralDisplay" class="text-6xl sm:text-7xl font-extrabold tracking-tight drop-shadow-md">
          7
        </span>
        <!-- Graphical Object Count -->
        <div id="counterIcons" class="flex flex-wrap justify-center gap-1 mt-2 max-w-[200px]">
          <!-- Dynamic count items (stars/circles) injected here -->
        </div>
      </div>
      <p class="text-xs sm:text-sm text-slate-600 mt-2 font-medium">
        Listen & spell the number word using the tiles below!
      </p>
    </div>

    <!-- MIDDLE SECTION: ANSWER SLOTS -->
    <section class="w-full bg-white/80 backdrop-blur-md rounded-2xl p-4 sm:p-5 shadow-lg border border-white flex flex-col items-center">
      <div class="text-xs font-semibold text-slate-400 tracking-wider uppercase mb-2">
        Drop or Tap Letters Here (<span id="letterCountGoal">5</span> letters)
      </div>

      <!-- Target Slots Container -->
      <div id="slotsContainer" class="flex flex-wrap justify-center gap-2 sm:gap-3 py-2 min-h-[72px] sm:min-h-[84px] items-center">
        <!-- Rendered dynamically -->
      </div>

      <!-- Live status / encouragement message -->
      <div id="feedbackText" class="text-xs sm:text-sm font-bold min-h-[20px] text-center mt-1 text-slate-500 transition-all">
        Tap or drag letters into the boxes!
      </div>
    </section>

    <!-- BOTTOM SECTION: 8 LETTER TILES POOL -->
    <section class="w-full bg-indigo-50/70 border border-indigo-100 rounded-2xl p-3 sm:p-4 shadow-inner flex flex-col items-center">
      <div class="text-xs font-semibold text-indigo-700 tracking-wider uppercase mb-2.5">
        Letter Pool (8 Letters)
      </div>

      <!-- The 8 Letters Container -->
      <div id="poolContainer" class="grid grid-cols-4 sm:grid-cols-8 gap-2 sm:gap-2.5 w-full justify-items-center">
        <!-- 8 tiles generated dynamically -->
      </div>
    </section>

    <!-- ACTION BUTTONS TOOLBAR -->
    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 w-full">
      <button id="hintBtn" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold shadow-md tile-3d text-sm sm:text-base">
        <span>💡</span> Hint
      </button>

      <button id="resetBtn" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold shadow-md tile-3d text-sm sm:text-base">
        <span>↺</span> Clear
      </button>

      <button id="checkBtn" class="flex items-center gap-1.5 px-6 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold shadow-md tile-3d text-sm sm:text-base">
        <span>✓</span> Check
      </button>

      <button id="nextBtn" class="flex items-center gap-1.5 px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md tile-3d text-sm sm:text-base">
        <span>Next ➔</span>
      </button>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="max-w-2xl mx-auto w-full text-center py-2 text-xs text-slate-400 font-medium">
    Designed for GitHub Pages • Tap or drag to spell • Web Audio powered
  </footer>

  <!-- SCRIPT LOGIC -->
  <script>
    /* ==========================================================
       1. DATA DEFINITIONS & GAME STATE
       ========================================================== */
    const NUMBERS_DICT = [
      { num: 1, word: "one", icon: "⭐" },
      { num: 2, word: "two", icon: "🍎" },
      { num: 3, word: "three", icon: "🌸" },
      { num: 4, word: "four", icon: "🚗" },
      { num: 5, word: "five", icon: "🎈" },
      { num: 6, word: "six", icon: "🍕" },
      { num: 7, word: "seven", icon: "🚀" },
      { num: 8, word: "eight", icon: "🍇" },
      { num: 9, word: "nine", icon: "⚽" },
      { num: 10, word: "ten", icon: "💎" }
    ];

    const ALPHABET = "abcdefghijklmnopqrstuvwxyz";

    let state = {
      currentNumberObj: null,
      targetWord: "",
      poolTiles: [], // [{ id, char, inSlotIndex: null | number }]
      slots: [],     // Array of length word.length, holds tileId or null
      score: 0,
      streak: 0,
      soundEnabled: true,
      roundSolved: false
    };

    /* ==========================================================
       2. WEB AUDIO SYNTHESIZER (No external assets required)
       ========================================================== */
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const soundEffects = {
      click() {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.07);
      },
      returnTile() {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(280, ctx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      },
      success() {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 arpeggio
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.09);
          osc.stop(ctx.currentTime + idx * 0.09 + 0.36);
        });
      },
      error() {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(140, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.23);
      },
      hint() {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.16);
      }
    };

    /* ==========================================================
       3. GAME CORE SETUP & GENERATOR
       ========================================================== */
    function initRound() {
      state.roundSolved = false;

      // Randomly pick whole number 1 to 10 (avoid immediate repeated number)
      let candidate;
      do {
        candidate = NUMBERS_DICT[Math.floor(Math.random() * NUMBERS_DICT.length)];
      } while (state.currentNumberObj && candidate.num === state.currentNumberObj.num && NUMBERS_DICT.length > 1);

      state.currentNumberObj = candidate;
      state.targetWord = candidate.word.toLowerCase();

      // Reset slots (empty slots array)
      state.slots = new Array(state.targetWord.length).fill(null);

      // Create letters: needed letters + distractors to equal exactly 8
      const neededLetters = state.targetWord.split('');
      const distractorsNeeded = 8 - neededLetters.length;
      const poolChars = [...neededLetters];

      for (let i = 0; i < distractorsNeeded; i++) {
        // Pick a random lowercase letter
        const randLetter = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
        poolChars.push(randLetter);
      }

      // Shuffle using Fisher-Yates
      for (let i = poolChars.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [poolChars[i], poolChars[j]] = [poolChars[j], poolChars[i]];
      }

      // Populate pool tile objects
      state.poolTiles = poolChars.map((char, idx) => ({
        id: `tile-${idx}-${Date.now()}`,
        char: char,
        inSlotIndex: null
      }));

      // Update feedback message
      setFeedback("Tap or drag letters to spell the number word!", "text-slate-500");

      renderGame();
    }

    /* Helper: feedback update */
    function setFeedback(msg, colorClass) {
      const fb = document.getElementById('feedbackText');
      fb.className = `text-xs sm:text-sm font-bold min-h-[20px] text-center mt-1 transition-all ${colorClass}`;
      fb.innerText = msg;
    }

    /* ==========================================================
       4. DOM RENDERING
       ========================================================== */
    function renderGame() {
      // 1. Top Section - Numeral & Count Icons
      const numeralEl = document.getElementById('numeralDisplay');
      numeralEl.innerText = state.currentNumberObj.num;

      const counterContainer = document.getElementById('counterIcons');
      counterContainer.innerHTML = '';
      for (let i = 0; i < state.currentNumberObj.num; i++) {
        const span = document.createElement('span');
        span.className = 'text-base sm:text-lg animate-pop';
        span.style.animationDelay = `${i * 0.04}s`;
        span.innerText = state.currentNumberObj.icon;
        counterContainer.appendChild(span);
      }

      // Target letter count goal label
      document.getElementById('letterCountGoal').innerText = state.targetWord.length;

      // 2. Middle Section - Slots
      const slotsContainer = document.getElementById('slotsContainer');
      slotsContainer.innerHTML = '';

      state.slots.forEach((tileId, slotIndex) => {
        const slotEl = document.createElement('div');
        slotEl.dataset.slotIndex = slotIndex;
        slotEl.className = "slot relative w-12 h-14 sm:w-14 sm:h-16 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50/70 flex items-center justify-center transition-all duration-150";

        if (tileId !== null) {
          const tile = state.poolTiles.find(t => t.id === tileId);
          if (tile) {
            slotEl.classList.remove('border-dashed', 'border-slate-300', 'bg-slate-50/70');
            slotEl.classList.add('border-indigo-400', 'bg-white', 'shadow-md');

            const tileInner = document.createElement('div');
            tileInner.className = `w-full h-full rounded-2xl flex items-center justify-center text-2xl sm:text-3xl font-extrabold text-indigo-700 bg-gradient-to-b from-indigo-100 to-indigo-200 border-2 border-indigo-400 tile-3d cursor-pointer select-none animate-pop`;
            tileInner.innerText = tile.char;
            tileInner.title = "Click to return to bottom pool";

            // Click placed letter to return to bottom pool
            tileInner.addEventListener('click', (e) => {
              e.stopPropagation();
              returnTileToPool(tile.id);
            });

            slotEl.appendChild(tileInner);
          }
        } else {
          // Empty slot placeholder indicator
          const dot = document.createElement('div');
          dot.className = 'w-3 h-3 rounded-full bg-slate-200 pointer-events-none';
          slotEl.appendChild(dot);
        }

        // Slot Drag & Drop listeners
        slotEl.addEventListener('dragover', handleDragOver);
        slotEl.addEventListener('dragleave', handleDragLeave);
        slotEl.addEventListener('drop', handleDrop);

        // Click on empty slot could also be a target
        slotEl.addEventListener('click', () => {
          if (state.slots[slotIndex] === null) {
            // Find first available letter in pool and move here
            const firstAvailable = state.poolTiles.find(t => t.inSlotIndex === null);
            if (firstAvailable) {
              placeTileInSlot(firstAvailable.id, slotIndex);
            }
          }
        });

        slotsContainer.appendChild(slotEl);
      });

      // 3. Bottom Section - 8 Letters Pool
      const poolContainer = document.getElementById('poolContainer');
      poolContainer.innerHTML = '';

      state.poolTiles.forEach((tile) => {
        const tileWrapper = document.createElement('div');
        tileWrapper.className = 'w-12 h-14 sm:w-14 sm:h-16 flex items-center justify-center';

        if (tile.inSlotIndex === null) {
          const btn = document.createElement('div');
          btn.id = tile.id;
          btn.dataset.char = tile.char;
          btn.draggable = true;
          btn.className = `w-12 h-14 sm:w-14 sm:h-16 rounded-2xl bg-gradient-to-b from-amber-200 via-amber-300 to-amber-400 text-amber-950 border-2 border-amber-400/80 font-bold text-2xl sm:text-3xl flex items-center justify-center cursor-grab active:cursor-grabbing tile-3d select-none transform transition-transform hover:scale-105 active:scale-95`;
          btn.innerText = tile.char;

          // Mouse Click to place in first empty slot
          btn.addEventListener('click', () => {
            placeInFirstOpenSlot(tile.id);
          });

          // HTML5 Desktop Drag listeners
          btn.addEventListener('dragstart', handleDragStart);
          btn.addEventListener('dragend', handleDragEnd);

          // Mobile Touch Drag listeners
          attachTouchDragEvents(btn, tile.id);

          tileWrapper.appendChild(btn);
        } else {
          // Placeholder ghost slot in pool to maintain clean grid alignment
          const emptyPlaceholder = document.createElement('div');
          emptyPlaceholder.className = 'w-12 h-14 sm:w-14 sm:h-16 rounded-2xl border-2 border-dashed border-indigo-200 bg-white/40 flex items-center justify-center';
          tileWrapper.appendChild(emptyPlaceholder);
        }

        poolContainer.appendChild(tileWrapper);
      });

      // Update Header stats
      document.getElementById('scoreDisplay').innerText = `Score: ${state.score}`;
      document.getElementById('streakDisplay').innerText = state.streak;
    }

    /* ==========================================================
       5. GAME INTERACTIONS & SLOT LOGIC
       ========================================================== */
    function placeInFirstOpenSlot(tileId) {
      if (state.roundSolved) return;
      const firstOpenIndex = state.slots.findIndex(s => s === null);
      if (firstOpenIndex !== -1) {
        placeTileInSlot(tileId, firstOpenIndex);
      } else {
        // Feedback if all slots are filled
        setFeedback("All boxes are full! Click 'Check' or tap a letter to remove it.", "text-amber-600");
        soundEffects.error();
      }
    }

    function placeTileInSlot(tileId, slotIndex) {
      if (state.roundSolved) return;

      const tile = state.poolTiles.find(t => t.id === tileId);
      if (!tile) return;

      // If this slot already had a tile, return that one to the pool
      if (state.slots[slotIndex] !== null) {
        const oldTileId = state.slots[slotIndex];
        const oldTile = state.poolTiles.find(t => t.id === oldTileId);
        if (oldTile) oldTile.inSlotIndex = null;
      }

      // If the incoming tile was already in another slot, clear that slot
      if (tile.inSlotIndex !== null) {
        state.slots[tile.inSlotIndex] = null;
      }

      // Place tile
      state.slots[slotIndex] = tile.id;
      tile.inSlotIndex = slotIndex;

      soundEffects.click();
      renderGame();

      // Automatically check if all slots are filled
      if (!state.slots.includes(null)) {
        checkCurrentAnswer(false); // passive check
      }
    }

    function returnTileToPool(tileId) {
      if (state.roundSolved) return;
      const tile = state.poolTiles.find(t => t.id === tileId);
      if (!tile) return;

      if (tile.inSlotIndex !== null) {
        state.slots[tile.inSlotIndex] = null;
        tile.inSlotIndex = null;
      }

      soundEffects.returnTile();
      renderGame();
    }

    function resetAllSlots() {
      if (state.roundSolved) return;
      state.poolTiles.forEach(tile => {
        tile.inSlotIndex = null;
      });
      state.slots = new Array(state.targetWord.length).fill(null);
      soundEffects.returnTile();
      setFeedback("Letters cleared! Try again.", "text-slate-500");
      renderGame();
    }

    /* Provide a helpful hint: places one correct letter into the correct slot */
    function provideHint() {
      if (state.roundSolved) return;

      // Find indices that are currently wrong or empty
      const targetChars = state.targetWord.split('');
      const incorrectIndices = [];

      targetChars.forEach((char, idx) => {
        const currentTileId = state.slots[idx];
        if (!currentTileId) {
          incorrectIndices.push(idx);
        } else {
          const currentTile = state.poolTiles.find(t => t.id === currentTileId);
          if (!currentTile || currentTile.char !== char) {
            incorrectIndices.push(idx);
          }
        }
      });

      if (incorrectIndices.length === 0) {
        setFeedback("You've already placed all correct letters! Tap Check.", "text-indigo-600");
        return;
      }

      // Pick the first wrong index for a logical left-to-right hint
      const hintSlotIndex = incorrectIndices[0];
      const neededChar = targetChars[hintSlotIndex];

      // Find an available matching tile that isn't already correctly placed
      let candidateTile = state.poolTiles.find(t => {
        if (t.char !== neededChar) return false;
        // make sure it isn't already sitting in another correct slot
        if (t.inSlotIndex !== null && state.targetWord[t.inSlotIndex] === t.char) {
          return false;
        }
        return true;
      });

      if (!candidateTile) {
        candidateTile = state.poolTiles.find(t => t.char === neededChar);
      }

      if (candidateTile) {
        placeTileInSlot(candidateTile.id, hintSlotIndex);
        soundEffects.hint();
        setFeedback(`Hint: Placed letter '${neededChar}'!`, "text-amber-700");
      }
    }

    /* Check Current Answer */
    function checkCurrentAnswer(isManualCheck = true) {
      if (state.roundSolved) return;

      // Build current spelled word from slots
      let spelledWord = "";
      let hasEmpty = false;

      for (let i = 0; i < state.slots.length; i++) {
        const tileId = state.slots[i];
        if (!tileId) {
          hasEmpty = true;
          break;
        }
        const tile = state.poolTiles.find(t => t.id === tileId);
        spelledWord += tile ? tile.char : "";
      }

      if (hasEmpty) {
        if (isManualCheck) {
          setFeedback("Fill in all boxes first!", "text-rose-500");
          soundEffects.error();
          shakeSlots();
        }
        return;
      }

      if (spelledWord === state.targetWord) {
        // SUCCESS!
        state.roundSolved = true;
        state.score += 10;
        state.streak += 1;
        soundEffects.success();
        triggerConfetti();

        setFeedback(`🎉 Fantastic! You spelled "${state.targetWord.toUpperCase()}"!`, "text-emerald-600");
        renderGame();

        // Highlight slots in green
        const slots = document.querySelectorAll('.slot');
        slots.forEach(slot => {
          slot.classList.remove('border-indigo-400');
          slot.classList.add('border-emerald-500', 'bg-emerald-50');
        });

        // Auto prompt next round after a pleasant delay
        setTimeout(() => {
          if (state.roundSolved) {
            initRound();
          }
        }, 2200);

      } else {
        // INCORRECT
        if (state.streak > 0) state.streak = 0;
        soundEffects.error();
        shakeSlots();
        setFeedback("Oops, not quite! Try rearranging the letters.", "text-rose-500");
        renderGame();
      }
    }

    function shakeSlots() {
      const container = document.getElementById('slotsContainer');
      container.classList.add('animate-wiggle');
      setTimeout(() => {
        container.classList.remove('animate-wiggle');
      }, 500);
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 50,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    /* ==========================================================
       6. DRAG & DROP IMPLEMENTATION (Desktop & Touch)
       ========================================================== */
    let draggedTileId = null;

    // Desktop HTML5 drag & drop
    function handleDragStart(e) {
      if (state.roundSolved) return;
      draggedTileId = this.id;
      e.dataTransfer.setData('text/plain', this.id);
      this.classList.add('dragging-ghost');
    }

    function handleDragEnd() {
      this.classList.remove('dragging-ghost');
      draggedTileId = null;
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('slot-hover'));
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      this.classList.add('slot-hover');
    }

    function handleDragLeave() {
      this.classList.remove('slot-hover');
    }

    function handleDrop(e) {
      e.preventDefault();
      this.classList.remove('slot-hover');
      const tileId = e.dataTransfer.getData('text/plain') || draggedTileId;
      const targetSlotIndex = parseInt(this.dataset.slotIndex, 10);

      if (tileId && !isNaN(targetSlotIndex)) {
        placeTileInSlot(tileId, targetSlotIndex);
      }
    }

    // Touch device drag & drop (iOS Safari / Android Chrome)
    function attachTouchDragEvents(element, tileId) {
      let touchClone = null;
      let startX, startY;
      let isDragging = false;

      element.addEventListener('touchstart', (e) => {
        if (state.roundSolved) return;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        isDragging = false;
      }, { passive: true });

      element.addEventListener('touchmove', (e) => {
        if (state.roundSolved) return;
        const touch = e.touches[0];
        const dist = Math.hypot(touch.clientX - startX, touch.clientY - startY);

        if (dist > 8 && !isDragging) {
          isDragging = true;
          // Create floating ghost tile for touch
          touchClone = element.cloneNode(true);
          touchClone.id = 'touch-clone-active';
          touchClone.classList.add('touch-dragging');
          touchClone.style.left = `${touch.clientX}px`;
          touchClone.style.top = `${touch.clientY}px`;
          document.body.appendChild(touchClone);
          element.classList.add('dragging-ghost');
        }

        if (isDragging && touchClone) {
          e.preventDefault(); // Prevent scrolling while dragging
          touchClone.style.left = `${touch.clientX}px`;
          touchClone.style.top = `${touch.clientY}px`;

          // Check if hovering over any slot
          const elemUnder = document.elementFromPoint(touch.clientX, touch.clientY);
          const slot = elemUnder ? elemUnder.closest('.slot') : null;
          document.querySelectorAll('.slot').forEach(s => s.classList.remove('slot-hover'));
          if (slot) {
            slot.classList.add('slot-hover');
          }
        }
      }, { passive: false });

      element.addEventListener('touchend', (e) => {
        if (isDragging) {
          if (touchClone && touchClone.parentNode) {
            touchClone.parentNode.removeChild(touchClone);
          }
          element.classList.remove('dragging-ghost');
          document.querySelectorAll('.slot').forEach(s => s.classList.remove('slot-hover'));

          const touch = e.changedTouches[0];
          const elemUnder = document.elementFromPoint(touch.clientX, touch.clientY);
          const targetSlot = elemUnder ? elemUnder.closest('.slot') : null;

          if (targetSlot && targetSlot.dataset.slotIndex !== undefined) {
            const slotIdx = parseInt(targetSlot.dataset.slotIndex, 10);
            placeTileInSlot(tileId, slotIdx);
          }
          isDragging = false;
        }
      });
    }

    /* ==========================================================
       7. EVENT LISTENERS SETUP
       ========================================================== */
    window.onload = function () {
      // Sound Toggle Button
      const soundBtn = document.getElementById('soundToggle');
      soundBtn.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        soundBtn.innerText = state.soundEnabled ? '🔊' : '🔇';
        soundBtn.classList.toggle('opacity-50', !state.soundEnabled);
      });

      // Hint Button
      document.getElementById('hintBtn').addEventListener('click', () => {
        getAudioContext(); // warm up audio context on user gesture
        provideHint();
      });

      // Clear/Reset Button
      document.getElementById('resetBtn').addEventListener('click', () => {
        getAudioContext();
        resetAllSlots();
      });

      // Check Button
      document.getElementById('checkBtn').addEventListener('click', () => {
        getAudioContext();
        checkCurrentAnswer(true);
      });

      // Next Number Button
      document.getElementById('nextBtn').addEventListener('click', () => {
        getAudioContext();
        initRound();
      });

      // Keyboard support: Enter to check, Escape to reset
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          checkCurrentAnswer(true);
        } else if (e.key === 'Escape') {
          resetAllSlots();
        }
      });

      // Start first round
      initRound();
    };
  </script>
</body>
</html>
