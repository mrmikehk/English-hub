<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game with Fullscreen Controls</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Container holding canvas and UI controls */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Native Fullscreen adjustments */
    #game-container:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      aspect-ratio: auto;
    }

    /* Vendor prefix support */
    #game-container:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      aspect-ratio: auto;
    }

    /* Canvas scales automatically to fit */
    #game-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Floating UI layer - pointer-events: none lets clicks reach the game canvas if needed */
    #game-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 10;
    }

    /* Top bar for utility actions like fullscreen */
    .top-bar {
      display: flex;
      justify-content: flex-end;
    }

    /* Bottom overlay for movement / action controls */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    /* Shared button styles - pointer-events: auto re-enables click/touch */
    .game-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
    }

    .game-btn:active {
      background: rgba(255, 255, 255, 1);
      transform: scale(0.95);
    }

    /* D-pad layout */
    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .dpad-row {
      display: flex;
      gap: 6px;
    }

    .dpad-btn {
      width: 48px;
      height: 48px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Game display surface -->
    <canvas id="game-canvas" width="800" height="600"></canvas>

    <!-- Overlay UI and Controls -->
    <div id="game-ui">
      <div class="top-bar">
        <button id="fullscreen-btn" class="game-btn">⛶ Fullscreen</button>
      </div>

      <div class="controls-bar">
        <!-- Directional controls (D-Pad) -->
        <div class="dpad">
          <button id="btn-up" class="game-btn dpad-btn" aria-label="Up">▲</button>
          <div class="dpad-row">
            <button id="btn-left" class="game-btn dpad-btn" aria-label="Left">◀</button>
            <button id="btn-down" class="game-btn dpad-btn" aria-label="Down">▼</button>
            <button id="btn-right" class="game-btn dpad-btn" aria-label="Right">▶</button>
          </div>
        </div>

        <!-- Action button -->
        <button id="btn-action" class="game-btn" style="min-width: 64px; height: 48px;">Action</button>
      </div>
    </div>
  </div>

  <script>
    // --- Fullscreen Toggle Logic ---
    const gameContainer = document.getElementById('game-container');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    function toggleFullscreen() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

      if (!isFullscreen) {
        if (gameContainer.requestFullscreen) {
          gameContainer.requestFullscreen();
        } else if (gameContainer.webkitRequestFullscreen) {
          gameContainer.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFullscreenButtonState() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
      fullscreenBtn.textContent = isFullscreen ? '✖ Exit' : '⛶ Fullscreen';
    }

    document.addEventListener('fullscreenchange', updateFullscreenButtonState);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButtonState);

    // --- Simple Canvas Game Demo Loop ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // Player position and state
    const player = { x: 375, y: 275, size: 50, speed: 5 };
    const keys = { up: false, down: false, left: false, right: false };

    // Button event helper to support both mouse and touch
    function bindControl(buttonId, directionKey) {
      const btn = document.getElementById(buttonId);
      const press = (e) => { e.preventDefault(); keys[directionKey] = true; };
      const release = (e) => { e.preventDefault(); keys[directionKey] = false; };

      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
    }

    bindControl('btn-up', 'up');
    bindControl('btn-down', 'down');
    bindControl('btn-left', 'left');
    bindControl('btn-right', 'right');

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    // Render loop
    function gameLoop() {
      // Movement update
      if (keys.up && player.y > 0) player.y -= player.speed;
      if (keys.down && player.y + player.size < canvas.height) player.y += player.speed;
      if (keys.left && player.x > 0) player.x -= player.speed;
      if (keys.right && player.x + player.size < canvas.width) player.x += player.speed;

      // Draw background
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw player box
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y, player.size, player.size);

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
