<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Wenzel | Curriculum Vitae</title>
  <style>
    :root {
      --primary: #1e3a5f;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #2d3748;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 48px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    /* Top Navigation Bar */
    .site-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 32px;
    }

    .site-nav .nav-brand {
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      font-size: 1.05rem;
    }

    .site-nav .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .site-nav .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .site-nav .nav-links a:hover,
    .site-nav .nav-links a.active {
      color: var(--accent);
    }

    /* Header Profile */
    header {
      display: flex;
      align-items: center;
      gap: 32px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 32px;
      margin-bottom: 32px;
    }

    .profile-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      flex-shrink: 0;
      background-color: #e2e8f0;
    }

    .header-content h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .header-content .subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 12px;
    }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.95rem;
    }

    .contact-links a {
      color: var(--accent);
      text-decoration: none;
    }

    .contact-links a:hover {
      text-decoration: underline;
    }

    section {
      margin-bottom: 36px;
    }

    section:last-child {
      margin-bottom: 0;
    }

    h2 {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .entry {
      margin-bottom: 24px;
    }

    .entry:last-child {
      margin-bottom: 0;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .role-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--primary);
    }

    .organization {
      font-weight: 500;
      color: var(--text);
    }

    .date-badge {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    ul.bullet-list {
      margin-top: 6px;
      padding-left: 20px;
    }

    ul.bullet-list li {
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px
