<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Town Unit 1 HFW Sentence Scramble Challenge</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 10%, #fef9c3 0%, #e0f2fe 50%, #dbeafe 100%);
      color: #1e293b;
    }

    /* Header & Progress Bar */
    .header-bar {
      width: 100%;
      max-width: 820px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 20px;
      border: 3px solid #fde68a;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .badge-tracker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      color: #475569;
    }

    .badge-counter {
      background: #fef08a;
      color: #854d0e;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 16px;
    }

    /* Navigation / Reset buttons */
    .icon-btn {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      color: #475569;
      transition: background 0.15s ease;
    }

    .icon-btn:hover {
      background: #e2e8f0;
    }

    /* Main Container */
    .activity-wrapper {
      width: 100%;
      max-width: 820px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Section Label */
    .section-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 6px;
    }

    /* Top Word Bank */
    .word-bank-zone {
      background: #ffffff;
      padding: 16px;
      border-radius: 24px;
      border: 3px dashed #93c5fd;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
      min-height: 120px;
    }

    .cards-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      min-height: 60px;
    }

    /* Word Card Styling */
    .word-card {
      background: #ffffff;
      border: 3px solid #3b82f6;
      border-bottom-width: 6px;
      color: #1e3a8a;
      font-size: 20px;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 16px;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(37,99,235,0.15);
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      touch-action: none;
    }

    .word-card:active {
      cursor: grabbing;
      transform: scale(0.95);
    }

    .word-card.dragging {
      opacity: 0.45;
      transform: scale(0.9);
    }

    /* Drop Zone / Sentence Track */
    .drop-track-zone {
      background: #ffffff;
      padding: 18px;
      border-radius: 24px;
      border: 4px solid #fde68a;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slots-track {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      min-height: 70px;
      background: #f8fafc;
      border-radius: 16px;
      border: 2px dashed #cbd5e1;
      padding: 10px;
    }

    /* Controls Bar */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .check-btn {
      background: #22c55e;
      color: #ffffff;
      border: none;
      border-bottom: 5px solid #15803d;
      border-radius: 16px;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(34,197,94,0.25);
      transition: transform 0.1s ease;
    }

    .check-btn:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    /* Incorrect wiggle */
    @keyframes wiggle {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(4px); }
    }

    .shake-error {
      animation: wiggle 0.45s ease;
      border-color: #ef4444 !important;
      background: #fee2e2 !important;
    }

    /* Success pop */
    @keyframes successBounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .success-pulse {
      animation: successBounce 0.4s ease;
      border-color: #22c55e !important;
      background: #dcfce7 !important;
    }

    /* Particle burst */
    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 2rem;
      animation: flyUp 0.8s ease-out forwards;
      z-index: 100;
    }

    @keyframes flyUp {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); opacity: 0; }
    }

    /* Completion Overlay */
    #finishModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 120;
    }

    .modal-card {
      background: #ffffff;
      border: 4px solid #facc15;
      border-radius: 28px;
      padding: 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #1e293b;
      margin: 10px 0 6px;
    }
  </style>
</head>
<body>

  <!-- Top Progress Bar -->
  <div class="header-bar">
    <div class="badge-tracker">
      <span>✏️ Sentence</span>
      <span id="levelCounter" class="badge-counter">1 of 6</span>
    </div>
    <button type="button" class="icon-btn" onclick="resetCurrentSentence()">🔄 Reset Words</button>
  </div>

  <div class="activity-wrapper">
    <!-- Top Word Bank (Pool) -->
    <div class="word-bank-zone">
      <div class="section-label">Word Bank (Tap or Drag Words)</div>
      <div id="wordBank" class="cards-flex" ondragover="allowDrop(event)" ondrop="handleDropToBank(event)">
        <!-- Shuffled cards loaded here -->
      </div>
    </div>

    <!-- Drop Zone / Sentence Build Slot Track -->
    <div class="drop-track-zone" id="sentenceZone">
      <div class="section-label">Build the Sentence Here</div>
      <div id="sentenceTrack" class="slots-track" ondragover="allowDrop(event)" ondrop="handleDropToTrack(event)">
        <!-- Dropped cards go here -->
      </div>
      
      <div class="controls-row">
        <span id="feedbackPrompt" style="font-size: 14px; font-weight: 700; color: #64748b;">
          💡 Remember: Sentences start with capitals and end with punctuation!
        </span>
        <button type="button" class="check-btn" onclick="validateSentence()">Check Answer ➔</button>
      </div>
    </div>
  </div>

  <!-- Final Celebration Screen -->
  <div id="finishModal">
    <div class="modal-card">
      <div style="font-size: 52px; animation: bounce 1s infinite;">🎉</div>
      <div class="modal-title">Well Done!</div>
      <p style="color: #64748b; font-weight: 600; font-size: 15px; margin-bottom: 20px;">
        You solved all 6 sentences with proper capitalization and punctuation!
      </p>
      <button type="button" class="check-btn" style="width: 100%;" onclick="restartEntireGame()">Play Again</button>
    </div>
  </div>

  <script>
    /*
      ===================================================================
      SENTENCE DATABASE & DISTRACTORS
      - target: Exact correct word token sequence
      - pool: Shuffled tokens including:
          * Correct words
          * Lowercase start distractor
          * Non-punctuated end distractor
          * Extra tricky distractor cards
      ===================================================================
    */
    const SENTENCES = [
      {
        target: ["She", "is", "a", "girl."],
        pool: ["She", "she", "is", "a", "girl.", "girl", "he"]
      },
      {
        target: ["He", "is", "a", "boy."],
        pool: ["He", "he", "is", "a", "boy.", "boy", "She"]
      },
      {
        target: ["I", "am", "five", "years", "old."],
        pool: ["I", "i", "am", "five", "years", "old.", "old", "six"]
      },
      {
        target: ["This", "is", "a", "red", "ball."],
        pool: ["This", "this", "is", "a", "red", "ref", "ball.", "ball"]
      },
      {
        target: ["No", "I", "am", "not", "six."],
        pool: ["No", "no", "I", "i", "am", "not", "six.", "six", "five"]
      },
      {
        target: ["I", "like", "this", "blue", "robot."],
        pool: ["I", "i", "like", "this", "This", "blue", "robot.", "robot"]
      }
    ];

    let currentIdx = 0;
    let draggedElement = null;

    // Web Audio Synthesizer for cheerful chimes without loading external files
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;

        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'correct') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const start = ctx.currentTime + (i * 0.08);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.14, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.25);
          });
        } else if (type === 'wrong') {
          [220, 164.81].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const start = ctx.currentTime + (i * 0.12);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.12, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.2);
          });
        }
      } catch (err) {}
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function spawnConfetti(x, y) {
      const icons = ['⭐', '🎉', '✨', '🎈', '🌟', '🍭', '🥳'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = icons[Math.floor(Math.random() * icons.length)];
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 90;
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    // Load active round
    function loadSentence(index) {
      currentIdx = index;
      document.getElementById('levelCounter').textContent = `${index + 1} of ${SENTENCES.length}`;
      document.getElementById('feedbackPrompt').textContent = "💡 Remember: Sentences start with capitals and end with punctuation!";
      document.getElementById('feedbackPrompt').style.color = "#64748b";

      const bank = document.getElementById('wordBank');
      const track = document.getElementById('sentenceTrack');
      bank.innerHTML = '';
      track.innerHTML = '';

      const shuffledWords = shuffle(SENTENCES[index].pool);

      shuffledWords.forEach((wordText, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'word-card';
        card.textContent = wordText;
        card.id = `card-${index}-${i}-${wordText}`;
        card.setAttribute('draggable', 'true');

        // Drag events
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);

        // Click / Tap support (swaps cards between Bank & Track)
        card.addEventListener('click', () => {
          playSound('pop');
          if (card.parentElement.id === 'wordBank') {
            track.appendChild(card);
          } else {
            bank.appendChild(card);
          }
        });

        bank.appendChild(card);
      });
    }

    // Drag & Drop Handlers
    function handleDragStart(e) {
      draggedElement = e.target;
      e.target.classList.add('dragging');
      e.dataTransfer.setData('text/plain', e.target.id);
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      draggedElement = null;
    }

    function allowDrop(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDropToTrack(e) {
      e.preventDefault();
      if (!draggedElement) return;
      playSound('pop');
      document.getElementById('sentenceTrack').appendChild(draggedElement);
    }

    function handleDropToBank(e) {
      e.preventDefault();
      if (!draggedElement) return;
      playSound('pop');
      document.getElementById('wordBank').appendChild(draggedElement);
    }

    // Check sentence solution
    function validateSentence() {
      const track = document.getElementById('sentenceTrack');
      const zone = document.getElementById('sentenceZone');
      const feedback = document.getElementById('feedbackPrompt');
      const placedCards = Array.from(track.querySelectorAll('.word-card'));
      const placedWords = placedCards.map(c => c.textContent.trim());
      const targetWords = SENTENCES[currentIdx].target;

      // Check match
      const isCorrect = placedWords.length === targetWords.length &&
        placedWords.every((word, idx) => word === targetWords[idx]);

      if (isCorrect) {
        playSound('correct');
        zone.classList.add('success-pulse');
        feedback.textContent = "🌟 Fantastic! Capital letter and punctuation match!";
        feedback.style.color = "#15803d";

        const rect = zone.getBoundingClientRect();
        spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);

        setTimeout(() => {
          zone.classList.remove('success-pulse');
          if (currentIdx + 1 < SENTENCES.length) {
            loadSentence(currentIdx + 1);
          } else {
            document.getElementById('finishModal').style.display = 'flex';
          }
        }, 1200);

      } else {
        playSound('wrong');
        zone.classList.add('shake-error');

        // Context-aware helpful hint
        if (placedWords.length === 0) {
          feedback.textContent = "⚠️ Drag or tap words into the box first!";
        } else if (placedWords[0] && placedWords[0] !== targetWords[0] && placedWords[0].toLowerCase() === targetWords[0].toLowerCase()) {
          feedback.textContent = "🔎 Look closely at the first word. Does it have a Capital letter?";
        } else if (placedWords.length > 0 && !placedWords[placedWords.length - 1].endsWith('.')) {
          feedback.textContent = "🔎 Look at the end of the sentence. Does the last word have a period (.)?";
        } else {
          feedback.textContent = "❌ Not quite right yet. Check word order and punctuation!";
        }
        feedback.style.color = "#b91c1c";

        setTimeout(() => zone.classList.remove('shake-error'), 500);
      }
    }

    function resetCurrentSentence() {
      loadSentence(currentIdx);
    }

    function restartEntireGame() {
      document.getElementById('finishModal').style.display = 'none';
      loadSentence(0);
    }

    // Start on load
    loadSentence(0);
  </script>
</body>
</html>
