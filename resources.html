<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Resources | Michael Wenzel</title>
  <style>
    :root {
      --primary: #1e3a5f;
      --accent: #2563eb;
      --text: #2d3748;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 48px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    nav {
      margin-bottom: 24px;
    }

    nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    section {
      margin-bottom: 36px;
    }

    h2 {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .resource-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .resource-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      background: var(--bg);
      display: flex;
