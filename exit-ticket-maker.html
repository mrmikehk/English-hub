    margin: 8mm;

  * {

  }

  body {

  }

  .control-grid {
    display: grid;

    margin-bottom: 12px;
  }

  .full-width {
    grid-column: span 2;
  }

  label {

  }

    font-family: inherit;
    background: #f8fafc;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
    background: #fff;
  }

  .btn-group {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }

  button {

    font-size: 12pt;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 8px;

    border: none;

  }

  .btn-generate {
    background: #2563eb;
    color: #ffffff;
  }

  .btn-generate:hover {
    background: #1d4ed8;
  }

  .btn-print {
    background: #059669;
    color: #ffffff;
  }

  .btn-print:hover {
    background: #047857;
  }

    break-after: page;
  }
