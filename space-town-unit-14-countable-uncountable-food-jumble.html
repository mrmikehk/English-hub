<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>There Is / There Are: Sentence Jumble</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
            touch-action: manipulation; /* Improves touch responsiveness */
        }

        .bg-pattern {
            background-color: #ffde59;
            background-image: radial-gradient(#ffc837 2px, transparent 2px);
            background-size: 20px 20px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.5s; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-pattern text-gray-800">

    <div id="app-container" class="bg-white rounded-[2rem] p-6 sm:p-10 max-w-5xl w-full text-center shadow-2xl relative border-8 border-white overflow-hidden">
        
        <!-- MAIN MENU -->
        <div id="main-menu" class="flex flex-col items-center py-10">
            <div class="text-7xl mb-4">🧩🥪</div>
            <h1 class="text-5xl md:text-6xl font-black text-indigo-600 tracking-wide mb-4">Sentence Jumble</h1>
            <p class="text-2xl text-gray-500 mb-10 font-bold">There is / There are + Food</p>
            
            <button onclick="startGame()" class="bg-gradient-to-r from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 text-white text-3xl font-black py-6 px-12 rounded-3xl shadow-[0_8px_0_0_#c2410c] transform transition active:translate-y-[8px] active:shadow-none w-full max-w-md">
                PLAY NOW! 🚀
            </button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="hidden flex-col w-full">
            
            <!-- Header (Score & Round) -->
            <div class="flex justify-between items-center mb-8 bg-indigo-50 p-4 rounded-2xl border-4 border-indigo-100">
                <div class="flex flex-col items-start px-4">
                    <span class="text-indigo-400 font-bold uppercase tracking-widest text-sm mb-1">Score</span>
                    <span class="text-3xl font-black text-indigo-600"><span id="score-val">0</span> ⭐</span>
                </div>
                <div class="flex flex-col items-end px-4">
                    <span class="text-indigo-400 font-bold uppercase tracking-widest text-sm mb-1">Question</span>
                    <span id="round-counter" class="text-3xl font-black text-indigo-600">1 / 10</span>
                </div>
            </div>

            <!-- Instruction -->
            <p class="text-2xl font-bold text-gray-600 mb-4">Tap the words to build the sentence!</p>

            <!-- Assembly Area (Where words go when clicked) -->
            <div id="assembly-area" class="min-h-[120px] bg-gray-50 border-4 border-dashed border-gray-300 rounded-3xl p-6 mb-8 flex flex-wrap justify-center content-center gap-4 transition-colors duration-300">
                <!-- Assembled words populate here -->
            </div>

            <!-- Word Bank Area (Available words) -->
            <div id="word-bank" class="min-h-[120px] flex flex-wrap justify-center gap-4 mb-8">
                <!-- Scrambled words populate here -->
            </div>

            <!-- Feedback Area -->
            <div id="feedback-message" class="text-2xl font-black h-10 mb-4 opacity-0 transition-opacity">
                <!-- Feedback text -->
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-center gap-6">
                <button onclick="clearAssembly()" id="btn-clear" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-2xl font-bold py-4 px-8 rounded-2xl shadow-[0_6px_0_0_#9ca3af] transform transition active:translate-y-[6px] active:shadow-none">
                    Clear
                </button>
                <button onclick="checkAnswer()" id="btn-check" class="bg-gradient-to-r from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white text-2xl font-black py-4 px-12 rounded-2xl shadow-[0_6px_0_0_#166534] transform transition active:translate-y-[6px] active:shadow-none">
                    Check Answer ✅
                </button>
                <button onclick="nextQuestion()" id="btn-next" class="hidden bg-gradient-to-r from-blue-400 to-blue-500 hover:from-blue-500 hover:to-blue-600 text-white text-2xl font-black py-4 px-12 rounded-2xl shadow-[0_6px_0_0_#1e3a8a] transform transition active:translate-y-[6px] active:shadow-none">
                    Next Question ➡️
                </button>
            </div>
        </div>

        <!-- END SCREEN -->
        <div id="end-screen" class="hidden flex-col items-center justify-center py-10">
            <h2 class="text-6xl font-black text-indigo-600 mb-6 uppercase tracking-wider">Great Job!</h2>
            
            <div class="text-8xl mb-6 animate-pop" id="end-emoji">🏆</div>
            
            <p class="text-3xl text-gray-500 font-bold mb-2">Final Score</p>
            <p class="text-7xl font-black text-orange-500 mb-12"><span id="final-score">0</span> / 10</p>
            
            <button onclick="showMainMenu()" class="bg-indigo-500 hover:bg-indigo-600 text-white text-3xl font-black py-6 px-12 rounded-3xl shadow-[0_8px_0_0_#3730a3] transform transition active:translate-y-[8px] active:shadow-none w-full max-w-md">
                Play Again 🔄
            </button>
        </div>

    </div>

    <script>
        // Database of Sentences with Chunks
        const allSentenceData = [
            ["There", "is", "a little", "milk."],
            ["There", "are", "a few", "strawberries."],
            ["There", "is", "a lot of", "sugar."],
            ["There", "are", "a lot of", "apples."],
            ["There", "is", "a little", "cheese."],
            ["There", "are", "a few", "eggs."],
            ["There", "is", "a lot of", "rice."],
            ["There", "are", "a few", "steaks."],
            ["There", "is", "a little", "juice."],
            ["There", "are", "a lot of", "grapes."],
            ["There", "is", "a little", "butter."],
            ["There", "are", "a few", "sandwiches."],
            ["There", "is", "a lot of", "meat."],
            ["There", "are", "a lot of", "oranges."],
            ["There", "is", "a little", "jam."],
            ["There", "are", "a few", "lemons."],
            ["There", "is", "a lot of", "pasta."],
            ["There", "are", "a few", "watermelons."],
            ["There", "is", "a little", "flour."],
            ["There", "are", "a lot of", "onions."]
        ];

        // Game State
        const TOTAL_QUESTIONS = 10;
        let score = 0;
        let currentQuestionIndex = 0;
        let activeSentences = [];
        
        let correctSentenceStr = ""; // Holds the correct sentence string
        let wordBankArr = [];        // Words currently in the bank
        let assemblyArr = [];        // Words currently placed by user
        let isWaiting = false;       // Prevents interaction during animations

        // UI Elements
        const screenMain = document.getElementById('main-menu');
        const screenGame = document.getElementById('game-screen');
        const screenEnd = document.getElementById('end-screen');
        
        const elScoreVal = document.getElementById('score-val');
        const elRoundCounter = document.getElementById('round-counter');
        const elAssemblyArea = document.getElementById('assembly-area');
        const elWordBank = document.getElementById('word-bank');
        const elFeedback = document.getElementById('feedback-message');
        const elFinalScore = document.getElementById('final-score');
        const elEndEmoji = document.getElementById('end-emoji');
        const btnCheck = document.getElementById('btn-check');
        const btnClear = document.getElementById('btn-clear');
        const btnNext = document.getElementById('btn-next');

        function hideAllScreens() {
            [screenMain, screenGame, screenEnd].forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('flex');
            });
        }

        function showMainMenu() {
            hideAllScreens();
            screenMain.classList.remove('hidden');
            screenMain.classList.add('flex');
        }

        function startGame() {
            score = 0;
            currentQuestionIndex = 0;
            
            // Randomly select sentences for this game
            const shuffledSentences = [...allSentenceData].sort(() => 0.5 - Math.random());
            activeSentences = shuffledSentences.slice(0, TOTAL_QUESTIONS);
            
            elScoreVal.innerText = score;
            
            hideAllScreens();
            screenGame.classList.remove('hidden');
            screenGame.classList.add('flex');
            
            loadQuestion();
        }

        function loadQuestion() {
            isWaiting = false;
            elAssemblyArea.style.borderColor = '#d1d5db'; // default gray
            elAssemblyArea.style.backgroundColor = '#f9fafb';
            elFeedback.style.opacity = '0';
            
            btnCheck.classList.remove('hidden');
            btnNext.classList.add('hidden');
            
            // Update Headers
            elRoundCounter.innerText = `${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;
            
            // Prepare Word Objects for current sentence
            const sentenceArr = activeSentences[currentQuestionIndex];
            correctSentenceStr = sentenceArr.join(' ');
            
            let initialWords = [...sentenceArr];

            // Distractor logic
            // 1. Lowercase distractor for the first word
            initialWords.push(sentenceArr[0].toLowerCase());

            if (sentenceArr.includes("is")) initialWords.push("are");
            else if (sentenceArr.includes("are")) initialWords.push("is");
            
            if (sentenceArr.includes("a few")) initialWords.push("a little");
            else if (sentenceArr.includes("a little")) initialWords.push("a few");
            else if (sentenceArr.includes("a lot of")) {
                initialWords.push(Math.random() > 0.5 ? "a few" : "a little");
                // The opposite verb is already handled by the first rule above
            }

            // Create objects and shuffle for the word bank
            wordBankArr = initialWords.map((word, index) => ({
                id: `word-${index}`,
                text: word // Preserve exact casing
            }));
            
            wordBankArr.sort(() => 0.5 - Math.random());

            assemblyArr = [];
            renderWords();
        }

        function createWordButton(wordObj, onClickAction, isAssembly = false) {
            const btn = document.createElement('button');
            
            // Flexbox is used to guarantee text is centered completely inside the card UI
            let baseClasses = "flex items-center justify-center rounded-xl text-2xl px-6 py-3 m-2 font-bold transition-colors active:translate-y-[4px] active:shadow-none animate-pop cursor-pointer ";
            
            if (isAssembly) {
                btn.className = baseClasses + "bg-indigo-600 shadow-[0_4px_0_0_#3730a3] text-white hover:bg-indigo-700";
            } else {
                btn.className = baseClasses + "bg-white shadow-[0_4px_0_0_#c7d2fe] text-indigo-700 hover:bg-indigo-50";
            }
            
            btn.innerText = wordObj.text;
            btn.onclick = onClickAction;
            return btn;
        }

        function renderWords() {
            // Render Assembly Area
            elAssemblyArea.innerHTML = '';
            assemblyArr.forEach(wordObj => {
                const btn = createWordButton(wordObj, () => returnWord(wordObj.id), true);
                elAssemblyArea.appendChild(btn);
            });

            // Render Word Bank Area
            elWordBank.innerHTML = '';
            wordBankArr.forEach(wordObj => {
                const btn = createWordButton(wordObj, () => selectWord(wordObj.id), false);
                elWordBank.appendChild(btn);
            });
        }

        function selectWord(id) {
            if (isWaiting) return;
            const wordIndex = wordBankArr.findIndex(w => w.id === id);
            if (wordIndex > -1) {
                const word = wordBankArr.splice(wordIndex, 1)[0];
                assemblyArr.push(word);
                renderWords();
            }
        }

        function returnWord(id) {
            if (isWaiting) return;
            const wordIndex = assemblyArr.findIndex(w => w.id === id);
            if (wordIndex > -1) {
                const word = assemblyArr.splice(wordIndex, 1)[0];
                wordBankArr.push(word);
                renderWords();
            }
        }

        function clearAssembly() {
            if (isWaiting) return;
            if (assemblyArr.length > 0) {
                wordBankArr = [...wordBankArr, ...assemblyArr];
                assemblyArr = [];
                renderWords();
            }
        }

        function checkAnswer() {
            if (isWaiting) return;
            
            const userSentence = assemblyArr.map(w => w.text).join(' ');

            if (userSentence === correctSentenceStr) {
                // Correct Match
                isWaiting = true;
                score++;
                elScoreVal.innerText = score;
                elScoreVal.parentElement.classList.add('animate-pop');
                setTimeout(() => elScoreVal.parentElement.classList.remove('animate-pop'), 400);

                elAssemblyArea.style.borderColor = '#4ade80';
                elAssemblyArea.style.backgroundColor = '#f0fdf4';
                showFeedback("Perfect! ✨", "text-green-600");
                
                // Show Next Question Button
                btnCheck.classList.add('hidden');
                btnNext.classList.remove('hidden');
            } else {
                // Incorrect
                isWaiting = true;
                elAssemblyArea.style.borderColor = '#f87171';
                elAssemblyArea.style.backgroundColor = '#fef2f2';
                elAssemblyArea.classList.add('animate-shake');
                showFeedback("Not quite right. Try again!", "text-red-500");
                
                setTimeout(() => {
                    elAssemblyArea.classList.remove('animate-shake');
                    elAssemblyArea.style.borderColor = '#d1d5db';
                    elAssemblyArea.style.backgroundColor = '#f9fafb';
                    clearAssembly();
                    isWaiting = false;
                }, 1500);
            }
        }

        function showFeedback(text, colorClass) {
            elFeedback.innerText = text;
            elFeedback.className = `text-2xl font-black h-10 mb-4 transition-opacity duration-300 opacity-100 ${colorClass}`;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            hideAllScreens();
            screenEnd.classList.remove('hidden');
            screenEnd.classList.add('flex');

            elFinalScore.innerText = score;
            
            if (score === TOTAL_QUESTIONS) {
                elEndEmoji.innerText = "🌟🏆🌟";
            } else if (score >= 7) {
                elEndEmoji.innerText = "⭐👍";
            } else {
                elEndEmoji.innerText = "👏";
            }
        }
    </script>
</body>
</html>
