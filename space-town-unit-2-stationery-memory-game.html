<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Town Unit 2 Stationery Memory Game (Pelmanism)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #16a34a;
      --error: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-back: #4f46e5;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 0.4rem;
    }

    .instructions {
      color: #64748b;
      font-size: 1rem;
    }

    .scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .grid-board {
      display: grid;
      grid-template-columns: repeat(4, 110px);
      gap: 0.85rem;
      perspective: 1000px;
    }

    .card {
      width: 110px;
      height: 110px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .card.flipped,
    .card.matched {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      padding: 0.5rem;
      text-align: center;
    }

    .card-back {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: #ffffff;
      border: 2px solid #4338ca;
      font-size: 2rem;
      font-weight: 700;
    }

    .card-back::after {
      content: '?';
    }

    .card:hover:not(.flipped):not(.matched) .card-back {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
    }

    .card-front {
      background: var(--card-bg);
      border: 2px solid var(--border);
      transform: rotateY(180deg);
    }

    .card-front img {
      width: 100%;
      height: 100%;
      max-height: 85px;
      object-fit: contain;
    }

    .card-front .word {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      text-transform: lowercase;
    }

    .card.matched .card-front {
      border-color: var(--success);
      background: #f0fdf4;
      cursor: default;
      opacity: 0.75;
    }

    .card.wrong .card-front {
      border-color: var(--error);
      background: #fef2f2;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-6px); }
      75% { transform: rotateY(180deg) translateX(6px); }
    }

    #win-banner {
      display: none;
      margin-top: 1.75rem;
      text-align: center;
    }

    #win-banner h2 {
      color: var(--success);
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }

    button.reset-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.reset-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    @media (max-width: 520px) {
      .grid-board {
        grid-template-columns: repeat(4, 75px);
        gap: 0.5rem;
      }
      .card {
        width: 75px;
        height: 75px;
      }
      .card-front img {
        max-height: 55px;
      }
      .card-front .word {
        font-size: 0.85rem;
      }
      .card-back {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Stationery Memory Game</h1>
    <p class="instructions">Flip two cards at a time to match each picture with its word label.</p>
  </header>

  <div class="scoreboard">
    <div>Matches: <span id="matches-count">0</span> / <span id="total-count">0</span></div>
    <div>Tries: <span id="tries-count">0</span></div>
  </div>

  <div class="grid-board" id="board"></div>

  <div id="win-banner">
    <h2>🎉 Well Done! You Found All Pairs!</h2>
    <button class="reset-btn" onclick="initGame()">Play Again</button>
  </div>

  <script>
    const allItems = [
      { id: 'pencil', word: 'a pencil', file: 'pencil.jpg' },
      { id: 'eraser', word: 'an eraser', file: 'eraser.jpg' },
      { id: 'ruler', word: 'a ruler', file: 'ruler.jpg' },
      { id: 'sharpener', word: 'a sharpener', file: 'sharpener.jpg' },
      { id: 'pen', word: 'a pen', file: 'pen.jpg' },
      { id: 'pencil-case', word: 'a pencil case', file: 'pencil-case.jpg' },
      { id: 'book', word: 'a book', file: 'book.jpg' },
      { id: 'school-bag', word: 'a school bag', file: 'school-bag.jpg' },
      { id: 'coloured-pencil', word: 'a coloured pencil', file: 'coloured-pencil.jpg' },
      { id: 'glue-stick', word: 'a glue stick', file: 'glue-stick.jpg' }
    ];

    const PAIRS_COUNT = 8; // 8 pairs = 16 cards (clean 4x4 grid)
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matchesCount = 0;
    let triesCount = 0;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initGame() {
      matchesCount = 0;
      triesCount = 0;
      firstCard = null;
      secondCard = null;
      lockBoard = false;

      document.getElementById('matches-count').textContent = '0';
      document.getElementById('total-count').textContent = PAIRS_COUNT;
      document.getElementById('tries-count').textContent = '0';
      document.getElementById('win-banner').style.display = 'none';

      const board = document.getElementById('board');
      board.innerHTML = '';

      // Pick 8 random stationery items from the pool
      const selectedItems = shuffle(allItems).slice(0, PAIRS_COUNT);

      // Create one image card and one word card for each selected item
      const deck = [];
      selectedItems.forEach(item => {
        deck.push({ id: item.id, type: 'image', payload: item.file, alt: item.word });
        deck.push({ id: item.id, type: 'word', payload: item.word });
      });

      // Shuffle all 16 cards together
      const shuffledDeck = shuffle(deck);

      shuffledDeck.forEach(cardData => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.dataset.id = cardData.id;

        const back = document.createElement('div');
        back.className = 'card-face card-back';

        const front = document.createElement('div');
        front.className = 'card-face card-front';

        if (cardData.type === 'image') {
          const img = document.createElement('img');
          img.src = `images/stationery/${cardData.payload}`;
          img.alt = cardData.alt.toLowerCase();
          front.appendChild(img);
        } else {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = cardData.payload.toLowerCase();
          front.appendChild(span);
        }

        cardEl.appendChild(back);
        cardEl.appendChild(front);

        cardEl.addEventListener('click', () => handleCardClick(cardEl));
        board.appendChild(cardEl);
      });
    }

    function handleCardClick(card) {
      if (lockBoard) return;
      if (card === firstCard) return;
      if (card.classList.contains('matched')) return;

      card.classList.add('flipped');

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      triesCount++;
      document.getElementById('tries-count').textContent = triesCount;

      checkMatch();
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.id === secondCard.dataset.id;

      if (isMatch) {
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        matchesCount++;
        document.getElementById('matches-count').textContent = matchesCount;

        resetTurn();

        if (matchesCount === PAIRS_COUNT) {
          document.getElementById('win-banner').style.display = 'block';
        }
      } else {
        lockBoard = true;
        firstCard.classList.add('wrong');
        secondCard.classList.add('wrong');

        setTimeout(() => {
          firstCard.classList.remove('flipped', 'wrong');
          secondCard.classList.remove('flipped', 'wrong');
          resetTurn();
        }, 850);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
