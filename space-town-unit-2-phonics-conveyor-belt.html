<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Town Phonics Conveyor | P1 Units 1 & 2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Nunito for clear primary school letterforms -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', sans-serif;
            background: radial-gradient(circle at 50% 15%, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        /* Starry Space Background */
        .space-bg {
            background-image: 
                radial-gradient(2px 2px at 25px 35px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 75px 85px, #fde047, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 140px 45px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 130px, #f472b6, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 220px 220px;
        }

        /* Conveyor Belt Treads */
        .conveyor-treads {
            background: repeating-linear-gradient(
                90deg,
                #334155 0px,
                #334155 24px,
                #475569 24px,
                #475569 34px
            );
            background-size: 68px 100%;
            animation: moveBelt 0.8s linear infinite;
            animation-play-state: paused;
        }
        .belt-active .conveyor-treads {
            animation-play-state: running;
        }
        @keyframes moveBelt {
            0% { background-position: 0 0; }
            100% { background-position: 68px 0; }
        }

        /* Spinning Conveyor Rollers */
        .roller-wheel {
            animation: spinWheel 1s linear infinite;
            animation-play-state: paused;
        }
        .belt-active .roller-wheel {
            animation-play-state: running;
        }
        @keyframes spinWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Crate Animations */
        .crate-pop {
            animation: cratePopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes cratePopIn {
            0% { transform: translateX(-90px) scale(0.85); opacity: 0.3; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        .shake-error {
            animation: shakeRed 0.4s ease-in-out;
        }
        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-7px); }
            80% { transform: translateX(7px); }
        }

        /* Big Tactile 3D Letter Chute Buttons */
        .letter-chute-btn {
            font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', sans-serif;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
            box-shadow: 0 8px 0 #0f172a, 0 12px 20px rgba(0, 0, 0, 0.45);
        }
        .letter-chute-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .letter-chute-btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #0f172a, 0 5px 10px rgba(0, 0, 0, 0.4);
        }

        /* Button States */
        .chute-default-0 {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border-color: #bae6fd;
        }
        .chute-default-1 {
            background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
            border-color: #e9d5ff;
        }
        .chute-default-2 {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            border-color: #fde68a;
        }
        .chute-correct {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%) !important;
            border-color: #dcfce7 !important;
            transform: scale(1.05) !important;
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.7), 0 6px 0 #14532d !important;
        }
        .chute-wrong {
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%) !important;
            border-color: #fecaca !important;
            opacity: 0.55;
        }
    </style>
</head>
<body class="space-bg min-h-screen flex flex-col items-center justify-start py-2 px-2 sm:px-4">

    <!-- ================= MAIN GAME CONTAINER ================= -->
    <div class="w-full max-w-4xl mx-auto flex flex-col gap-2.5">

        <!-- 1. TOP HEADER BAR -->
        <header class="bg-slate-800/95 border-2 border-slate-700 rounded-2xl px-3 py-2 shadow-lg flex flex-wrap items-center justify-between gap-2">
            <!-- Left: Back Link + Title -->
            <div class="flex items-center gap-2">
                <a href="games.html" class="bg-slate-700 hover:bg-slate-600 text-sky-300 font-bold px-3 py-1.5 rounded-xl text-xs sm:text-sm flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Games</span>
                </a>
                <div class="flex items-center gap-1.5">
                    <span class="text-xl sm:text-2xl">🚀</span>
                    <h1 class="text-sm sm:text-lg font-extrabold text-white tracking-wide">Space Town Phonics Conveyor</h1>
                </div>
            </div>

            <!-- Right: Score, Streak & Controls -->
            <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                <!-- Progress Pill -->
                <div id="progress-badge" class="bg-slate-900 border border-slate-700 text-sky-300 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-xl">
                    Word 1 / 10
                </div>

                <!-- Score Pill -->
                <div class="bg-amber-500/20 border border-amber-400/50 px-2.5 py-1 rounded-xl flex items-center gap-1" title="Score">
                    <i class="fa-solid fa-star text-amber-400 text-sm"></i>
                    <span id="score-val" class="font-extrabold text-amber-300 text-sm sm:text-base">0</span>
                </div>

                <!-- Streak Pill -->
                <div class="bg-emerald-500/20 border border-emerald-400/50 px-2.5 py-1 rounded-xl flex items-center gap-1" title="Streak">
                    <i class="fa-solid fa-fire text-emerald-400 text-sm"></i>
                    <span id="streak-val" class="font-extrabold text-emerald-300 text-sm sm:text-base">0</span>
                </div>

                <!-- Mute Button -->
                <button type="button" id="mute-btn" onclick="toggleMute()" class="bg-slate-700 hover:bg-slate-600 text-sky-300 px-2.5 py-1.5 rounded-xl text-sm font-bold transition" title="Mute / Unmute">
                    <i id="mute-icon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </header>

        <!-- 2. TEACHER MODE & SCAFFOLDING BAR -->
        <div class="bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-1.5 flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm">

                <!-- Word Hint Toggle -->

                    <i class="fa-solid fa-eye mr-1"></i>Word Hint: ON (_able)
                </button>
                <!-- Deck Length Toggle -->
                <button type="button" id="length-toggle-btn" onclick="toggleDeckLength()" class="bg-purple-500/20 border border-purple-400/60 text-purple-200 hover:bg-purple-500/30 font-bold px-2.5 py-1 rounded-lg transition">
                    <i class="fa-solid fa-layer-group mr-1"></i>Mode: 10 Words
                </button>
            </div>

            <div class="flex items-center gap-2">
                <button type="button" onclick="skipToNextWord()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold px-2.5 py-1 rounded-lg transition" title="Skip to Next Word">

            </div>
        </div>

        <!-- 3. CENTER CONVEYOR BELT STAGE -->
        <section id="conveyor-section" class="belt-active bg-slate-900/95 border-4 border-slate-700 rounded-3xl p-3 sm:p-4 shadow-2xl relative">

            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">

                    <span id="status-text" class="text-sm sm:text-base font-extrabold text-slate-100">
                        Listen and tap the beginning sound below!

                </div>

                    <span>🔊 Hear Word</span>
                </button>
            </div>

            <!-- SHIPPING CRATE IN THE CENTER OF THE BELT -->
            <div class="flex flex-col items-center justify-center my-1">
                <div id="shipping-crate" class="crate-pop bg-gradient-to-b from-amber-100 to-amber-200 border-4 border-amber-500 rounded-3xl w-64 sm:w-72 py-3 px-4 shadow-xl flex flex-col items-center justify-between relative">

                    <span class="w-2.5 h-2.5 rounded-full bg-amber-700/50 absolute top-2 left-2"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-700/50 absolute top-2 right-2"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-700/50 absolute bottom-2 left-2"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-700/50 absolute bottom-2 right-2"></span>

                        Unit 2 Classroom

                    <!-- Picture / SVG Display (Tap to replay audio) -->

                        <span id="word-rest-letters" class="text-2xl sm:text-3xl font-extrabold tracking-wide text-slate-100">able</span>

                    <div class="roller-wheel w-5 h-5 rounded-full border-4 border-dashed border-sky-400 bg-slate-950"></div>
                    <div class="roller-wheel w-5 h-5 rounded-full border-4 border-dashed border-sky-400 bg-slate-950"></div>
                    <div class="roller-wheel w-5 h-5 rounded-full border-4 border-dashed border-sky-400 bg-slate-950"></div>
                    <div class="roller-wheel w-5 h-5 rounded-full border-4 border-dashed border-sky-400 bg-slate-950"></div>
                </div>
            </div>
        </section>

        <!-- 4. BOTTOM SORTING CHUTES (PRE-POPULATED IN DOM & ALWAYS VISIBLE!) -->
        <section class="bg-slate-800/90 border-2 border-slate-700 rounded-3xl p-3 sm:p-4 shadow-xl">
            <div class="text-center mb-2">
                <h2 class="text-sm sm:text-base font-extrabold uppercase tracking-wider text-sky-300">
                    <i class="fa-solid fa-hand-pointer mr-1"></i> Tap the Beginning Sound:

            <div id="choices-grid" class="grid grid-cols-3 gap-3 sm:gap-5 max-w-2xl mx-auto">

                    <span id="choice-phoneme-0" class="mt-1.5 text-xs sm:text-sm font-extrabold bg-slate-950/35 px-3 py-0.5 rounded-full text-white/95">/t/</span>

                <button type="button" id="choice-btn-1" onclick="selectChoice(1)" class="letter-chute-btn chute-default-1 border-4 rounded-3xl py-3 sm:py-4 flex flex-col items-center justify-center text-white cursor-pointer">

                <button type="button" id="choice-btn-2" onclick="selectChoice(2)" class="letter-chute-btn chute-default-2 border-4 rounded-3xl py-3 sm:py-4 flex flex-col items-center justify-center text-white cursor-pointer">

                </button>
            </div>
        </section>

    </div>

    <!-- ================= END OF ROUND CELEBRATION MODAL ================= -->
    <div id="celebration-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-800 border-4 border-amber-400 rounded-3xl max-w-md w-full p-6 text-center shadow-2xl">
            <div id="modal-stars" class="text-4xl mb-2">⭐⭐⭐</div>
            <div class="text-6xl mb-2">🏆</div>
            <h2 class="text-2xl sm:text-3xl font-black text-amber-300 mb-1">Great Sorting!</h2>
            <p class="text-slate-300 text-sm mb-4">You sorted all the Space Town phonics crates!</p>

            <div class="grid grid-cols-3 gap-2 bg-slate-900 p-3.5 rounded-2xl border border-slate-700 mb-5">
                <div>
                    <div class="text-[11px] text-slate-400 font-bold uppercase">Score</div>
                    <div id="modal-score" class="text-2xl font-black text-amber-400">100</div>
                </div>
                <div>
                    <div class="text-[11px] text-slate-400 font-bold uppercase">Accuracy</div>
                    <div id="modal-accuracy" class="text-2xl font-black text-sky-400">100%</div>
                </div>
                <div>
                    <div class="text-[11px] text-slate-400 font-bold uppercase">Best Streak</div>
                    <div id="modal-streak" class="text-2xl font-black text-emerald-400">10 🔥</div>
                </div>
            </div>

            <div class="flex gap-3">
                <button type="button" onclick="startNewGame()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-2xl shadow-lg text-lg transition cursor-pointer">
                    <i class="fa-solid fa-play mr-1"></i> Play Again
                </button>
                <a href="games.html" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-2xl shadow-lg text-lg flex items-center justify-center transition">
                    All Games
                </a>
            </div>
        </div>
    </div>

    <!-- ================= GAME JAVASCRIPT ================= -->

                tag: 'Unit 1 & 2 Numbers',
                graphic: `<svg viewBox="0 0 110 90" class="w-28 h-24 drop-shadow">
                            <rect x="10" y="6" width="90" height="78" rx="16" fill="#059669" stroke="#ffffff" stroke-width="4"/>
                            <text x="55" y="62" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="900" font-family="Fredoka, sans-serif">6</text>
                          </svg>`
            },
            {
                word: 'seven',
                sound: 's',
                rest: 'even',
                tag: 'Unit 2 Numbers',
                graphic: `<svg viewBox="0 0 110 90" class="w-28 h-24 drop-shadow">
                            <rect x="10" y="6" width="90" height="78" rx="16" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/>
                            <text x="55" y="62" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="900" font-family="Fredoka, sans-serif">7</text>
                          </svg>`
            },
            {
                word: 'sun',
                sound: 's',
                rest: 'un',
                tag: 'Space Town',
                graphic: `<span class="text-7xl sm:text-8xl leading-none">☀️</span>`
            },

            // --- h (/h/) ---
            {
                word: 'hat',
                sound: 'h',
                rest: 'at',
                tag: 'Phonics /h/',
                graphic: `<span class="text-7xl sm:text-8xl leading-none">🎩</span>`
            },
            {
                word: 'hand',
                sound: 'h',
                rest: 'and',
                tag: 'Phonics /h/',
                graphic: `<span class="text-7xl sm:text-8xl leading-none">✋</span>`
            },
            {
                word: 'house',
                sound: 'h',
                rest: 'ouse',
                tag: 'Phonics /h/',
                graphic: `<span class="text-7xl sm:text-8xl leading-none">🏠</span>`
            }
        ];

        // State Variables
        let gameDeck = [];
        let currentIdx = 0;
        let currentWordObj = WORD_BANK[0];
        let currentChoices = ['t', 'b', 's']; // Maps directly to #choice-btn-0, 1, 2
        let score = 0;
        let streak = 0;
        let bestStreak = 0;
        let attemptsCount = 0;
        let correctCount = 0;
        let roundSize = 10; // 10 or 24
        let wordHintMode = 'blank'; // 'blank' (_able), 'full' (table), or 'hidden'
        let isMuted = false;
        let isLocked = false;
        let advanceTimer = null;

        // Web Audio Synthesizer for Instant Chimes & Boings
        let audioCtx = null;
        function playTone(type) {
            if (isMuted) return;
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

                const now = audioCtx.currentTime;
                if (type === 'correct') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.25);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.32);
                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.1);
                        gain.gain.setValueAtTime(0.2, now + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + i * 0.1);
                        osc.stop(now + i * 0.1 + 0.3);
                    });
                }
            } catch (e) {}
        }

        // Non-blocking Speech Synthesis (`en-GB`)
        function speakPhrase(text, rate = 0.85) {
            if (isMuted) return;
            try {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-GB';
                utter.rate = rate;
                utter.pitch = 1.05;

                const voices = window.speechSynthesis.getVoices();
                if (voices && voices.length > 0) {
                    const gbVoice = voices.find(v => v.lang && (v.lang.includes('en-GB') || v.lang.includes('en_GB'))) ||
                                    voices.find(v => v.lang && v.lang.startsWith('en'));
                    if (gbVoice) utter.voice = gbVoice;
                }
                window.speechSynthesis.speak(utter);
            } catch (e) {}
        }

        function speakCurrentWord(animateCrate = false) {
            if (!currentWordObj) return;
            if (animateCrate) {
                const graphic = document.getElementById('crate-graphic');
                if (graphic) {
                    graphic.classList.add('scale-110');
                    setTimeout(() => graphic.classList.remove('scale-110'), 200);
                }
            }
            speakPhrase(currentWordObj.word, 0.85);
        }

        // Fisher-Yates Array Shuffle
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Start or Restart the Game Immediately
        function startNewGame() {
            if (advanceTimer) clearTimeout(advanceTimer);
            isLocked = false;
            score = 0;
            streak = 0;
            bestStreak = 0;
            attemptsCount = 0;
            correctCount = 0;
            currentIdx = 0;

            const modal = document.getElementById('celebration-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            gameDeck = shuffle(WORD_BANK).slice(0, roundSize);
            updateScoreUI();
            loadNextItem();
        }

        // Synchronously Update the Crate and the 3 Pre-Populated Choice Buttons
        function loadNextItem() {
            if (advanceTimer) clearTimeout(advanceTimer);

            if (currentIdx >= gameDeck.length) {
                showCelebrationModal();
                return;
            }

            // Immediately unlock so buttons are always clickable right away
            isLocked = false;
            currentWordObj = gameDeck[currentIdx];

            // 1. Update Top Progress
            document.getElementById('progress-badge').textContent = `Word ${currentIdx + 1} / ${gameDeck.length}`;
            document.getElementById('status-dot').className = 'w-3.5 h-3.5 rounded-full bg-emerald-400 shadow-[0_0_10px_#4ade80]';
            document.getElementById('status-text').textContent = 'Listen and tap the beginning sound below!';

            // 2. Pulse Conveyor Belt Briefly
            const conveyorSec = document.getElementById('conveyor-section');
            conveyorSec.classList.add('belt-active');
            setTimeout(() => conveyorSec.classList.remove('belt-active'), 400);

            // 3. Update Crate Content
            const crate = document.getElementById('shipping-crate');
            crate.classList.remove('crate-pop', 'shake-error');
            void crate.offsetWidth;
            crate.classList.add('crate-pop');

            document.getElementById('crate-tag').textContent = currentWordObj.tag;
            document.getElementById('crate-graphic').innerHTML = currentWordObj.graphic;
            renderWordHintBox(false);

            // 4. Synchronously Update the 3 Pre-Populated Choice Buttons
            const correctSound = currentWordObj.sound;
            const distractors = shuffle(TARGET_SOUNDS.filter(s => s !== correctSound)).slice(0, 2);
            currentChoices = shuffle([correctSound, ...distractors]);

            for (let i = 0; i < 3; i++) {
                const letter = currentChoices[i];
                const btn = document.getElementById(`choice-btn-${i}`);
                const letterSpan = document.getElementById(`choice-letter-${i}`);
                const phonemeSpan = document.getElementById(`choice-phoneme-${i}`);

                btn.disabled = false;
                btn.className = `letter-chute-btn chute-default-${i} border-4 rounded-3xl py-3 sm:py-4 flex flex-col items-center justify-center text-white cursor-pointer`;
                letterSpan.textContent = letter;
                phonemeSpan.textContent = `/${letter}/`;
            }

            // 5. Speak the word
            setTimeout(() => speakCurrentWord(false), 120);
        }

        // Render the Word Hint Box on the Crate according to Teacher Mode
        function renderWordHintBox(revealAnswer) {
            const box = document.getElementById('word-hint-box');
            const firstLetterEl = document.getElementById('word-first-letter');
            const restEl = document.getElementById('word-rest-letters');

            restEl.textContent = currentWordObj.rest;

            if (revealAnswer) {
                box.classList.remove('hidden');
                firstLetterEl.textContent = currentWordObj.sound;
                firstLetterEl.className = 'text-2xl sm:text-3xl font-black text-emerald-400 border-b-4 border-emerald-400 px-1 mr-0.5';
                return;
            }

            if (wordHintMode === 'hidden') {
                box.classList.add('hidden');
            } else if (wordHintMode === 'full') {
                box.classList.remove('hidden');
                firstLetterEl.textContent = currentWordObj.sound;
                firstLetterEl.className = 'text-2xl sm:text-3xl font-black text-sky-400 border-b-4 border-sky-400 px-1 mr-0.5';
            } else {
                // 'blank' (_able)
                box.classList.remove('hidden');
                firstLetterEl.textContent = '_';
                firstLetterEl.className = 'text-2xl sm:text-3xl font-black text-amber-400 border-b-4 border-amber-400 px-1 mr-0.5';
            }
        }

        // Handle Clicking Any of the 3 Letter Chute Buttons (0, 1, or 2)
        function selectChoice(choiceIndex) {
            if (isLocked || !currentWordObj) return;

            const chosenLetter = currentChoices[choiceIndex];
            const correctLetter = currentWordObj.sound;
            const btn = document.getElementById(`choice-btn-${choiceIndex}`);
            const crate = document.getElementById('shipping-crate');

            attemptsCount++;

            if (chosenLetter === correctLetter) {
                // CORRECT!
                isLocked = true;
                correctCount++;
                score += 10;
                streak++;
                if (streak > bestStreak) bestStreak = streak;
                updateScoreUI();

                playTone('correct');
                btn.classList.add('chute-correct');
                renderWordHintBox(true);

                document.getElementById('status-dot').className = 'w-3.5 h-3.5 rounded-full bg-emerald-400 shadow-[0_0_14px_#4ade80]';
                document.getElementById('status-text').textContent = `Awesome! "${correctLetter}" is for ${currentWordObj.word}!`;

                // Speak phoneme + word
                const ph = PHONEME_SPEECH[correctLetter] || correctLetter;
                speakPhrase(`${ph}, ${currentWordObj.word}`, 0.9);

                // Advance to next word after 1.1s
                advanceTimer = setTimeout(() => {
                    currentIdx++;
                    loadNextItem();
                }, 1100);

            } else {
                // INCORRECT — Gentle feedback & retry
                streak = 0;
                updateScoreUI();
                playTone('wrong');

                btn.disabled = true;
                btn.classList.add('chute-wrong');

                crate.classList.remove('shake-error');
                void crate.offsetWidth;
                crate.classList.add('shake-error');

                document.getElementById('status-dot').className = 'w-3.5 h-3.5 rounded-full bg-rose-400 shadow-[0_0_12px_#fb7185]';
                document.getElementById('status-text').textContent = `Try again! Listen to "${currentWordObj.word}"...`;

                speakCurrentWord(false);
            }
        }

        // Teacher Controls
        function toggleWordHint() {
            const btn = document.getElementById('hint-toggle-btn');
            if (wordHintMode === 'blank') {
                wordHintMode = 'hidden';
                btn.innerHTML = `<i class="fa-solid fa-eye-slash mr-1"></i>Word Hint: OFF (Picture Only)`;
            } else if (wordHintMode === 'hidden') {
                wordHintMode = 'full';
                btn.innerHTML = `<i class="fa-solid fa-spell-check mr-1"></i>Word Hint: FULL (table)`;
            } else {
                wordHintMode = 'blank';
                btn.innerHTML = `<i class="fa-solid fa-eye mr-1"></i>Word Hint: ON (_able)`;
            }
            renderWordHintBox(false);
        }

        function toggleDeckLength() {
            const btn = document.getElementById('length-toggle-btn');
            roundSize = (roundSize === 10) ? 24 : 10;
            btn.innerHTML = `<i class="fa-solid fa-layer-group mr-1"></i>Mode: ${roundSize === 10 ? '10 Words' : 'All 24 Words'}`;
            startNewGame();
        }

        function skipToNextWord() {
            if (advanceTimer) clearTimeout(advanceTimer);
            currentIdx++;
            loadNextItem();
        }

        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById('mute-icon');
            if (isMuted) {
                try {
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                } catch (e) {}
                icon.className = 'fa-solid fa-volume-xmark text-rose-400';
            } else {
                icon.className = 'fa-solid fa-volume-high';
                speakCurrentWord(false);
            }
        }

        function updateScoreUI() {
            document.getElementById('score-val').textContent = score;
            document.getElementById('streak-val').textContent = streak;
        }

        function showCelebrationModal() {
            playTone('win');
            const accuracy = attemptsCount > 0 ? Math.round((correctCount / attemptsCount) * 100) : 100;
            let stars = '⭐⭐⭐';
            if (accuracy < 70) stars = '⭐';
            else if (accuracy < 90) stars = '⭐⭐';

            document.getElementById('modal-stars').textContent = stars;
            document.getElementById('modal-score').textContent = score;
            document.getElementById('modal-accuracy').textContent = `${accuracy}%`;
            document.getElementById('modal-streak').textContent = `${bestStreak} 🔥`;

            const modal = document.getElementById('celebration-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // Keyboard Support (1, 2, 3 or letter keys)
        window.addEventListener('keydown', (e) => {
            if (e.key === '1') selectChoice(0);
            else if (e.key === '2') selectChoice(1);
            else if (e.key === '3') selectChoice(2);
            else {
                const pressed = e.key.toLowerCase();
                const idx = currentChoices.indexOf(pressed);
                if (idx !== -1) selectChoice(idx);
            }
        });

        // Auto-start immediately when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startNewGame);
        } else {
            startNewGame();
        }
    </script>
</body>
