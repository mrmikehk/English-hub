<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Color Matcher</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Fredoka', 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 15%, #fefce8 0%, #e0f2fe 50%, #dbeafe 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100%;
    }

    /* Fixed responsive 3x3 Grid independent of Tailwind loading */
    #colorGrid {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      grid-template-rows: repeat(3, 1fr) !important;
      gap: 14px !important;
      width: 95vw !important;
      max-width: 480px !important;
      height: 95vw !important;
      max-height: 480px !important;
      margin: 0 auto !important;
    }

    /* Touch-friendly 3D card styling */
    .color-card {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      background-color: #ffffff !important;
      border: 4px solid #e2e8f0 !important;
      border-radius: 1.5rem !important;
      cursor: pointer !important;
      box-shadow: 0 8px 16px -2px rgba(15, 23, 42, 0.12) !important;
      transition: transform 0.12s ease, border-color 0.15s ease !important;
      padding: 6px !important;
      outline: none !important;
      user-select: none !important;
    }

    .color-card:hover {
      border-color: #f59e0b !important;
    }

    .color-card:active {
      transform: scale(0.92) !important;
    }

    /* Glossy Color Disc */
    .swatch-disc {
      position: relative;
      width: 68px !important;
      height: 68px !important;
      border-radius: 9999px !important;
      border-width: 4px !important;
      border-style: solid !important;
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.22), 0 6px 14px rgba(0, 0, 0, 0.12);
      pointer-events: none;
    }

    @media (min-width: 480px) {
      .swatch-disc {
        width: 82px !important;
        height: 82px !important;
      }
    }

    .swatch-disc::before {
      content: '';
      position: absolute;
      top: 9%;
      left: 14%;
      width: 42%;
      height: 25%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 9999px;
      transform: rotate(-25deg);
      pointer-events: none;
    }

    /* Wrong answer wiggle */
    @keyframes wiggleWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px) rotate(-3deg); }
      40% { transform: translateX(10px) rotate(3deg); }
      60% { transform: translateX(-6px) rotate(-2deg); }
      80% { transform: translateX(4px) rotate(1deg); }
    }

    .animate-wrong {
      animation: wiggleWrong 0.45s ease-in-out;
      border-color: #ef4444 !important;
      background-color: #fee2e2 !important;
    }

    /* Correct celebration pop */
    @keyframes celebratePop {
      0% { transform: scale(1); }
      45% { transform: scale(1.08) rotate(2deg); filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.8)); }
      100% { transform: scale(1); }
    }

    .animate-correct {
      animation: celebratePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-color: #22c55e !important;
      background-color: #dcfce7 !important;
    }

    /* Burst particles */
    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 2.2rem;
      animation: flyUpAndFade 0.8s ease-out forwards;
      z-index: 80;
    }

    @keyframes flyUpAndFade {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4); opacity: 0; }
    }

    /* Flashing Score Pulse */
    @keyframes flashScorePulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5));
      }
      50% {
        transform: scale(1.1);
        filter: drop-shadow(0 0 30px rgba(234, 88, 12, 0.9));
      }
    }

    .animate-flash-score {
      animation: flashScorePulse 0.9s infinite ease-in-out;
    }

    /* Urgent timer pulse */
    @keyframes urgentPulse {
      0%, 100% { color: #ef4444; transform: scale(1); }
      50% { color: #dc2626; transform: scale(1.08); }
    }
    .timer-warning {
      animation: urgentPulse 0.6s infinite ease-in-out;
    }

    /* Timer buttons styling */
    .timer-btn {
      cursor: pointer !important;
      outline: none !important;
      user-select: none !important;
    }
  </style>
</head>

<body class="flex flex-col items-center justify-between p-2 sm:p-4 min-h-screen">

  <!-- Header Bar -->
  <header class="w-full max-w-4xl flex items-center justify-between bg-white/95 backdrop-blur-md px-3 sm:px-6 py-2.5 rounded-3xl shadow-md border-2 border-amber-200">
    <!-- Score & Streak -->
    <div class="flex items-center gap-3 sm:gap-6">
      <div class="flex items-center gap-1.5 sm:gap-2">
        <span class="text-xl sm:text-3xl">⭐</span>
        <div>
          <div class="text-[10px] sm:text-[11px] uppercase tracking-wider text-slate-500 font-bold">Score</div>
          <div id="scoreDisplay" class="text-xl sm:text-3xl font-black text-amber-500 leading-none">0</div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 border-l-2 border-slate-200 pl-3 sm:pl-4">
        <span class="text-xl sm:text-3xl">🔥</span>
        <div>
          <div class="text-[10px] sm:text-[11px] uppercase tracking-wider text-slate-500 font-bold">Streak</div>
          <div id="streakDisplay" class="text-xl sm:text-3xl font-black text-orange-500 leading-none">0</div>
        </div>
      </div>
    </div>

    <!-- Countdown Timer & Switcher -->
    <div class="flex items-center gap-2 sm:gap-3 bg-amber-50 px-2.5 sm:px-4 py-1.5 rounded-2xl border border-amber-200">
      <div class="flex items-center gap-1">
        <span class="text-base sm:text-xl">⏳</span>
        <span id="timerDisplay" class="text-lg sm:text-2xl font-black text-slate-700 font-mono min-w-[45px] text-center">
          60s
        </span>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" id="btn60" class="timer-btn px-2.5 py-1 rounded-xl text-xs sm:text-sm font-black transition bg-amber-500 text-white shadow-sm">60s</button>
        <button type="button" id="btn90" class="timer-btn px-2.5 py-1 rounded-xl text-xs sm:text-sm font-black transition bg-white text-slate-600 hover:bg-amber-100">90s</button>
        <button type="button" id="btn120" class="timer-btn px-2.5 py-1 rounded-xl text-xs sm:text-sm font-black transition bg-white text-slate-600 hover:bg-amber-100">120s</button>
      </div>
    </div>

    <!-- Audio & Voice Tools -->
    <div class="flex items-center gap-1 sm:gap-2">
      <button type="button" id="speakBtn" title="Speak Color" class="w-10 h-10 rounded-2xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-lg font-bold flex items-center justify-center border border-indigo-200 active:scale-95 shadow-sm">
        🔊
      </button>
      <button type="button" id="soundToggleBtn" title="Toggle Sound Effects" class="w-10 h-10 rounded-2xl bg-sky-100 hover:bg-sky-200 text-sky-700 text-lg font-bold flex items-center justify-center border border-sky-200 active:scale-95 shadow-sm">
        🔔
      </button>
    </div>
  </header>

  <!-- Big Target Prompt Banner -->
  <section class="w-full max-w-4xl my-2 flex items-center justify-center">
    <div class="bg-white px-6 sm:px-10 py-2 sm:py-3 rounded-3xl shadow-lg border-4 border-amber-300 flex items-center gap-3">
      <span class="text-2xl sm:text-3xl animate-bounce">👉</span>
      <span class="text-lg sm:text-2xl font-extrabold text-slate-600 uppercase tracking-wide">Touch the:</span>
      <span id="targetNameDisplay" class="text-2xl sm:text-4xl font-black drop-shadow-sm tracking-wide capitalize" style="color: #ef4444;">
        Red
      </span>
    </div>
  </section>

  <!-- 3x3 Grid Wrapper -->
  <main class="w-full flex items-center justify-center my-auto py-2">
    <div id="colorGrid">
      <!-- 9 buttons generated here -->
    </div>
  </main>

  <!-- Footer Info Bar -->
  <footer class="w-full max-w-4xl py-1 flex items-center justify-between text-slate-500 text-xs sm:text-sm font-semibold px-2">
    <span>💡 Tip: Click 60s, 90s, or 120s above to choose your timer!</span>
    <button type="button" id="resetScoreBtn" class="hover:text-red-600 underline font-bold transition">Reset Score</button>
  </footer>

  <!-- Time's Up Score Flash Modal -->
  <div id="scoreFlashModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border-4 border-amber-400 p-6 sm:p-8 flex flex-col items-center text-center">
      <div class="text-5xl mb-2 animate-bounce">🏁</div>
      <h2 class="text-2xl sm:text-3xl font-black text-slate-800 uppercase tracking-wide mb-1">Time's Up!</h2>
      <p class="text-sm font-semibold text-slate-500 mb-6">Fantastic job identifying your colors!</p>

      <div class="w-full bg-gradient-to-br from-amber-50 to-orange-50 border-4 border-amber-300 rounded-3xl py-6 px-4 mb-6 flex flex-col items-center justify-center shadow-inner">
        <div class="text-xs uppercase tracking-widest font-black text-amber-600 mb-1">Final Score</div>
        <div id="flashFinalScore" class="animate-flash-score text-7xl font-black text-amber-500 leading-none">
          0
        </div>
        <div class="mt-4 flex items-center gap-2 text-sm font-bold text-slate-600 bg-white/80 px-3 py-1 rounded-full border border-amber-200">
          <span>🔥 Best Streak:</span>
          <span id="flashBestStreak" class="font-black text-orange-600">0</span>
        </div>
      </div>

      <button type="button" id="playAgainBtn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black text-lg rounded-2xl shadow-lg active:scale-95 transition">
        🚀 Play Again
      </button>
    </div>
  </div>

  <script>
    //
