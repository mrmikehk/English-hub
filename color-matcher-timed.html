<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Color Matcher</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Fredoka', 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 15%, #fefce8 0%, #e0f2fe 50%, #dbeafe 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100%;
    }

    /* Chunky, touch-friendly 3D card styling */
    .color-card {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, border-color 0.2s ease;
      cursor: pointer;
      box-shadow: 0 8px 16px -3px rgba(15, 23, 42, 0.12), 0 4px 6px -2px rgba(15, 23, 42, 0.05);
      min-height: 80px;
    }

    .color-card:active {
      transform: scale(0.93);
    }

    /* Glossy color bubble */
    .swatch-disc {
      position: relative;
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.22), 0 6px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease;
    }

    .swatch-disc::before {
      content: '';
      position: absolute;
      top: 9%;
      left: 14%;
      width: 42%;
      height: 25%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 9999px;
      transform: rotate(-25deg);
      pointer-events: none;
    }

    /* Incorrect wiggle */
    @keyframes wiggleWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-14px) rotate(-3deg); }
      40% { transform: translateX(12px) rotate(3deg); }
      60% { transform: translateX(-8px) rotate(-2deg); }
      80% { transform: translateX(6px) rotate(1deg); }
    }

    .animate-wrong {
      animation: wiggleWrong 0.5s ease-in-out;
      border-color: #ef4444 !important;
      background-color: #fee2e2 !important;
    }

    /* Celebratory pop */
    @keyframes celebratePop {
      0% { transform: scale(1); }
      45% { transform: scale(1.1) rotate(2deg); filter: drop-shadow(0 0 25px rgba(34, 197, 94, 0.8)); }
      100% { transform: scale(1); }
    }

    .animate-correct {
      animation: celebratePop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-color: #22c55e !important;
      background-color: #dcfce7 !important;
    }

    /* Floating party burst particles */
    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 2.5rem;
      animation: flyUpAndFade 0.85s ease-out forwards;
      z-index: 80;
    }

    @keyframes flyUpAndFade {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4); opacity: 0; }
    }

    @keyframes flashScorePulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
      }
      50% {
        transform: scale(1.12);
        filter: drop-shadow(0 0 35px rgba(234, 88, 12, 0.95));
      }
    }

    .animate-flash-score {
      animation: flashScorePulse 0.9s infinite ease-in-out;
    }

    @keyframes urgentPulse {
      0%, 100% { color: #ef4444; transform: scale(1); }
      50% { color: #dc2626; transform: scale(1.08); }
    }
    .timer-warning {
      animation: urgentPulse 0.6s infinite ease-in-out;
    }

    /* 3x3 Responsive Grid with rock-solid height/width fallbacks */
    .grid-board {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      grid-template-rows: repeat(3, minmax(0, 1fr)) !important;
      gap: 12px;
      width: 100%;
      max-width: 540px;
      height: 540px;
      max-height: 58vh;
    }

    @media (min-width: 640px) {
      .grid-board {
        gap: 16px;
        height: 560px;
        max-height: 62vh;
      }
    }

    .custom-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }
  </style>
</head>

<body class="flex flex-col items-center justify-between p-2 sm:p-4 min-h-screen">

  <!-- Header Bar -->
  <header class="w-full max-w-4xl flex items-center justify-between bg-white/95 backdrop-blur-md px-3 sm:px-6 py-2.5 rounded-3xl shadow-md border-2 border-amber-200">
    <div class="flex items-center gap-3 sm:gap-6">
      <div class="flex items-center gap-1.5 sm:gap-2">
        <span class="text-xl sm:text-3xl">⭐</span>
        <div>
          <div class="text-[10px] sm:text-[11px] uppercase tracking-wider text-slate-500 font-bold">Score</div>
          <div id="scoreDisplay" class="text-xl sm:text-3xl font-black text-amber-500 leading-none">0</div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 border-l-2 border-slate-200 pl-3 sm:pl-4">
        <span class="text-xl sm:text-3xl">🔥</span>
        <div>
          <div class="text-[10px] sm:text-[11px] uppercase tracking-wider text-slate-500 font-bold">Streak</div>
          <div id="streakDisplay" class="text-xl sm:text-3xl font-black text-orange-500 leading-none">0</div>
        </div>
      </div>
    </div>

    <!-- Countdown Timer & Switcher -->
    <div class="flex items-center gap-2 sm:gap-3 bg-amber-50 px-2.5 sm:px-4 py-1.5 rounded-2xl border border-amber-200">
      <div class="flex items-center gap-1">
        <span class="text-base sm:text-xl">⏳</span>
        <span id="timerDisplay" class="text-lg sm:text-2xl font-black text-slate-700 font-mono min-w-[45px] text-center">
          60s
        </span>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" data-duration="60" class="timer-btn px-2 py-1 rounded-xl text-xs sm:text-sm font-black transition bg-amber-500 text-white shadow-sm">60s</button>
        <button type="button" data-duration="90" class="timer-btn px-2 py-1 rounded-xl text-xs sm:text-sm font-black transition bg-white text-slate-600 hover:bg-amber-100">90s</button>
        <button type="button" data-duration="120" class="timer-btn px-2 py-1 rounded-xl text-xs sm:text-sm font-black transition bg-white text-slate-600 hover:bg-amber-100">120s</button>
      </div>
    </div>

    <!-- Interactive Tools -->
    <div class="flex items-center gap-1 sm:gap-2">
      <button type="button" id="speakBtn" title="Speak Color" class="w-10 h-10 rounded-2xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-lg font-bold flex items-center justify-center transition border border-indigo-200 active:scale-95 shadow-sm">
        🔊
      </button>
      <button type="button" id="soundToggleBtn" title="Toggle Sound" class="w-10 h-10 rounded-2xl bg-sky-100 hover:bg-sky-200 text-sky-700 text-lg font-bold flex items-center justify-center transition border border-sky-200 active:scale-95 shadow-sm">
        🔔
      </button>
      <button type="button" id="openSettingsBtn" title="Settings" class="w-10 h-10 rounded-2xl bg-purple-100 hover:bg-purple-200 text-purple-700 text-lg font-bold flex items-center justify-center transition border border-purple-200 active:scale-95 shadow-sm">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Big Target Prompt Banner -->
  <section class="w-full max-w-4xl my-2 flex items-center justify-center">
    <div class="bg-white px-6 sm:px-10 py-2 sm:py-3 rounded-3xl shadow-lg border-4 border-amber-300 flex items-center gap-3">
      <span class="text-2xl sm:text-3xl animate-bounce">👉</span>
      <span class="text-lg sm:text-2xl font-extrabold text-slate-600 uppercase tracking-wide">Touch the:</span>
      <span id="targetNameDisplay" class="text-2xl sm:text-4xl font-black drop-shadow-sm tracking-wide capitalize" style="color: #2563eb;">
        Red
      </span>
    </div>
  </section>

  <!-- 3x3 Color Cards Surface with explicit container bounds -->
  <main class="w-full max-w-4xl flex items-center justify-center my-auto py-2">
    <div id="colorGrid" class="grid-board">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <!-- Footer Info Bar -->
  <footer class="w-full max-w-4xl py-1 flex items-center justify-between text-slate-500 text-xs sm:text-sm font-semibold px-2">
    <span>💡 Tap 60s, 90s, or 120s to change time!</span>
    <button type="button" id="resetScoreBtn" class="hover:text-red-600 underline font-bold transition">Reset Score</button>
  </footer>

  <!-- Time's Up Score Flash Modal -->
  <div id="scoreFlashModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border-4 border-amber-400 p-6 sm:p-8 flex flex-col items-center text-center">
      <div class="text-5xl mb-2 animate-bounce">🏁</div>
      <h2 class="text-2xl sm:text-3xl font-black text-slate-800 uppercase tracking-wide mb-1">Time's Up!</h2>
      <p class="text-sm font-semibold text-slate-500 mb-6">Fantastic job identifying your colors!</p>

      <div class="w-full bg-gradient-to-br from-amber-50 to-orange-50 border-4 border-amber-300 rounded-3xl py-6 px-4 mb-6 flex flex-col items-center justify-center shadow-inner">
        <div class="text-xs uppercase tracking-widest font-black text-amber-600 mb-1">Final Score</div>
        <div id="flashFinalScore" class="animate-flash-score text-7xl font-black text-amber-500 leading-none">
          0
        </div>
        <div class="mt-4 flex items-center gap-2 text-sm font-bold text-slate-600 bg-white/80 px-3 py-1 rounded-full border border-amber-200">
          <span>🔥 Best Streak:</span>
          <span id="flashBestStreak" class="font-black text-orange-600">0</span>
        </div>
      </div>

      <button type="button" id="playAgainBtn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black text-lg rounded-2xl shadow-lg active:scale-95 transition">
        🚀 Play Again
      </button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl border-4 border-purple-300 overflow-hidden flex flex-col max-h-[90vh]">
      <div class="bg-purple-50 px-6 py-4 border-b-2 border-purple-200 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🎨</span>
          <div>
            <h2 class="text-xl font-black text-purple-900 leading-tight">Classroom Options & Colors</h2>
            <p class="text-xs text-purple-600 font-semibold">Self-contained browser storage.</p>
          </div>
        </div>
        <button type="button" id="closeSettingsBtn" class="text-slate-400 hover:text-slate-700 text-2xl font-bold p-2 leading-none">✕</button>
      </div>

      <div class="px-6 py-3 bg-amber-50 border-b border-amber-200 text-amber-900 text-xs flex flex-wrap gap-3 justify-between items-center">
        <div class="flex flex-wrap items-center gap-3">
          <span>🎨 Active Pool: <strong id="poolCount">11</strong> colors</span>
          <span class="text-slate-300">|</span>
          <label class="flex items-center gap-1.5 cursor-pointer font-bold select-none">
            <input type="checkbox" id="showLabelsToggle" class="w-4 h-4 text-purple-600 rounded">
            <span>Show words on cards</span>
          </label>
          <span class="text-slate-300">|</span>
          <label class="flex items-center gap-1.5 cursor-pointer font-bold select-none">
            <input type="checkbox" id="autoSpeakToggle" class="w-4 h-4 text-purple-600 rounded">
            <span>Auto-speak</span>
          </label>
        </div>
        <button type="button" id="addColorBtn" class="px-3.5 py-1.5 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl text-xs flex items-center gap-1 shadow-sm active:scale-95 transition">
          ➕ Add Color
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-3 custom-scroll" id="colorEditorList"></div>

      <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
        <button type="button" id="resetDefaultsBtn" class="px-4 py-2 text-xs font-bold text-red-600 hover:bg-red-50 rounded-xl transition border border-red-200">
          🔄 Restore 11 Defaults
        </button>
        <button type="button" id="saveAndCloseBtn" class="px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-2xl text-sm shadow-md transition active:scale-95">
          Save & Restart Game
        </button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_COLORS = [
      { id: 'red', name: 'Red', hex: '#ef4444', border: '#b91c1c' },
      { id: 'yellow', name: 'Yellow', hex: '#facc15', border: '#ca8a04' },
      { id: 'pink', name: 'Pink', hex: '#ec4899', border: '#be185d' },
      { id: 'green', name: 'Green', hex: '#22c55e', border: '#15803d' },
      { id: 'orange', name: 'Orange', hex: '#f97316', border: '#c2410c' },
      { id: 'purple', name: 'Purple', hex: '#a855f7', border: '#7e22ce' },
      { id: 'blue', name: 'Blue', hex: '#3b82f6', border: '#1d4ed8' },
      { id: 'black', name: 'Black', hex: '#1e293b', border: '#0f172a' },
      { id: 'white', name: 'White', hex: '#ffffff', border: '#cbd5e1' },
      { id: 'brown', name: 'Brown', hex: '#78350f', border: '#451a03' },
      { id: 'gray', name: 'Gray', hex: '#6b7280', border: '#374151' }
    ];

    const STORAGE_KEY_COLORS = 'ghpages_smartboard_colors_v2';
    const STORAGE_KEY_OPTIONS = 'ghpages_smartboard_colors_options_v2';

    function loadSavedColors() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_COLORS);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length >= 9) return parsed;
